<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멜로디 시창 훈련</title>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.6/build/cjs/vexflow.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
  button{cursor:pointer;border:none;background:none;font-family:inherit}

  /* ── HOME ──────────────────────────────────────────────── */
  #home{display:flex;flex-direction:column;min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);color:#fff;padding:2rem 1rem}
  #home .inner{max-width:700px;margin:0 auto;width:100%}
  #home .hero{text-align:center;margin-bottom:2.5rem}
  #home .hero-icon{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.1);display:inline-flex;align-items:center;justify-content:center;margin-bottom:1.25rem}
  #home .hero-icon svg{width:36px;height:36px;color:#a5b4fc}
  #home h1{font-size:2rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:.75rem}
  #home .hero-sub{color:#a5b4fc;font-size:.95rem;line-height:1.6;max-width:340px;margin:0 auto 1.25rem}
  #home .stats{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap}
  #home .stat{background:rgba(255,255,255,.1);border-radius:.75rem;padding:.6rem 1.2rem;text-align:center}
  #home .stat-val{font-size:1.1rem;font-weight:700}
  #home .stat-lbl{font-size:.7rem;color:#a5b4fc;margin-top:.15rem}
  #home .section-label{display:flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#a5b4fc;margin-bottom:1rem}
  #home .stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:2.5rem}
  @media(max-width:480px){#home .stage-grid{grid-template-columns:1fr 1fr}}
  #home .stage-card{text-align:left;border-radius:1rem;border:2px solid;padding:1rem;transition:all .18s;cursor:pointer}
  #home .stage-card:hover{transform:translateY(-2px)}
  #home .stage-num{width:34px;height:34px;border-radius:.6rem;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.85rem;margin-bottom:.6rem;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #home .stage-name{font-size:.95rem;font-weight:700;margin-bottom:.2rem}
  #home .stage-info{font-size:.7rem;color:#64748b;line-height:1.4;margin-bottom:.5rem}
  #home .diff-badge{font-size:.65rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;display:inline-block}

  /* ── TRAINER ────────────────────────────────────────────── */
  #trainer{display:none;flex-direction:column;min-height:100vh;background:#f8fafc}
  #trainer.active{display:flex}
  .trainer-header{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10}
  .trainer-header-inner{max-width:700px;margin:0 auto;padding:0 1rem;height:3.5rem;display:flex;align-items:center;justify-content:space-between}
  .home-btn{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:#94a3b8;transition:color .15s}
  .home-btn:hover{color:#1e293b}
  .header-title{display:flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:600;color:#475569}
  .stage-badge{font-size:.7rem;font-weight:700;padding:.25rem .65rem;border-radius:999px}
  .stage-banner{color:#fff}
  .stage-banner-inner{max-width:700px;margin:0 auto;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between}
  .banner-nav-btn{font-size:.8rem;font-weight:600;padding:.4rem .85rem;border-radius:.6rem;background:rgba(255,255,255,.2);color:#fff;transition:background .15s;display:flex;align-items:center;gap:.3rem}
  .banner-nav-btn:hover{background:rgba(255,255,255,.3)}
  .banner-nav-btn:disabled{opacity:.3;cursor:default}
  .banner-center{text-align:center}
  .banner-stage-name{font-size:1.05rem;font-weight:700}
  .banner-stage-sub{font-size:.7rem;opacity:.8;margin-top:.1rem}
  .stage-dots{max-width:700px;margin:0 auto;padding:.5rem 1rem .75rem;display:flex;justify-content:center;gap:.4rem}
  .stage-dot{height:10px;border-radius:999px;background:rgba(255,255,255,.35);transition:all .2s;cursor:pointer;width:10px}
  .stage-dot.active{width:22px;background:#fff}
  .stage-dot:hover{background:rgba(255,255,255,.65)}
  .trainer-body{max-width:700px;margin:0 auto;padding:1.25rem 1rem 2rem;width:100%}
  .stage-info-bar{border-radius:.875rem;padding:.65rem 1rem;font-size:.82rem;border:1.5px solid;margin-bottom:1rem}
  .progress-row{display:flex;justify-content:space-between;font-size:.72rem;color:#94a3b8;margin-bottom:.4rem}
  .progress-track{height:6px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:1rem}
  .progress-fill{height:100%;border-radius:999px;transition:width .4s}
  .exercise-card{background:#fff;border-radius:1.25rem;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:1.5rem;margin-bottom:1rem}
  .exercise-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;margin-bottom:1rem}
  .exercise-title{font-size:1.05rem;font-weight:700;color:#1e293b;margin-bottom:.2rem}
  .exercise-desc{font-size:.78rem;color:#64748b;line-height:1.5}
  .bpm-tag{font-size:.7rem;color:#94a3b8;flex-shrink:0;margin-top:.15rem}
  .sheet-wrap{border-radius:.875rem;border:1.5px solid;padding:.75rem;margin-bottom:1rem;overflow-x:auto;min-height:190px;display:flex;align-items:center;justify-content:center}
  .active-note-row{height:1.5rem;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:600;margin-bottom:1rem}
  .controls{display:flex;gap:.75rem}
  .play-btn{flex:1;height:3rem;border-radius:.875rem;font-size:.88rem;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:.5rem;transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .play-btn:active{transform:scale(.97)}
  .tip-btn{height:3rem;padding:0 1rem;border-radius:.875rem;font-size:.82rem;font-weight:600;background:#f1f5f9;color:#475569;border:1.5px solid #e2e8f0;display:flex;align-items:center;gap:.4rem;transition:background .15s}
  .tip-btn:hover{background:#e2e8f0}
  .tip-btn.open{border-color:currentColor}
  .tip-box{border-radius:.875rem;padding:1rem;font-size:.82rem;line-height:1.6;border:1.5px solid;margin-top:.75rem;display:flex;gap:.5rem}
  .note-list-card{background:#fff;border-radius:1.25rem;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:1.25rem;margin-bottom:1rem}
  .note-list-title{display:flex;align-items:center;gap:.5rem;font-size:.82rem;font-weight:700;color:#475569;margin-bottom:.875rem}
  .note-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
  @media(max-width:400px){.note-grid{grid-template-columns:repeat(2,1fr)}}
  .note-chip{border-radius:.6rem;padding:.45rem .65rem;font-size:.78rem;border:1.5px solid;transition:all .15s}
  .note-chip.active{transform:scale(1.06);font-weight:700}
  .note-chip-num{font-family:monospace;font-size:.65rem;opacity:.55}
  .note-chip-name{font-weight:600;margin-top:.05rem}
  .note-chip-dur{font-size:.65rem;opacity:.6;margin-top:.1rem}
  .ex-nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem}
  .nav-btn{display:flex;align-items:center;gap:.4rem;padding:.6rem 1.1rem;border-radius:.875rem;border:1.5px solid #e2e8f0;background:#fff;font-size:.82rem;font-weight:600;color:#475569;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .nav-btn:hover:not(:disabled){background:#f8fafc}
  .nav-btn:disabled{opacity:.4;cursor:default}
  .nav-btn.next-btn{color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .nav-btn.next-btn:hover:not(:disabled){filter:brightness(1.08)}
  .ex-dots{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center}
  .ex-dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;transition:all .15s;cursor:pointer}
  .ex-dot.active{transform:scale(1.35)}
  .ex-dot:hover{opacity:.75}
  .completion-card{border-radius:1.25rem;border:1.5px solid;padding:1.5rem;text-align:center;margin-bottom:1rem}
  .completion-title{font-size:1.3rem;font-weight:800;margin-bottom:.5rem}
  .completion-sub{font-size:.82rem;color:#64748b;margin-bottom:1rem}
  .completion-btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
  .comp-btn{padding:.6rem 1.5rem;border-radius:.875rem;font-size:.82rem;font-weight:700;color:#fff;transition:all .15s}
  .comp-btn:active{transform:scale(.97)}
  .comp-btn-home{background:#f1f5f9;color:#475569}

  /* ── COLORS ─────────────────────────────────────────────── */
  .c-emerald .stage-card{background:#ecfdf5;border-color:#a7f3d0}.c-emerald .stage-num{background:#059669}.c-emerald .stage-name{color:#065f46}
  .c-teal .stage-card{background:#f0fdfa;border-color:#99f6e4}.c-teal .stage-num{background:#0d9488}.c-teal .stage-name{color:#134e4a}
  .c-cyan .stage-card{background:#ecfeff;border-color:#a5f3fc}.c-cyan .stage-num{background:#0891b2}.c-cyan .stage-name{color:#164e63}
  .c-sky .stage-card{background:#f0f9ff;border-color:#bae6fd}.c-sky .stage-num{background:#0284c7}.c-sky .stage-name{color:#0c4a6e}
  .c-blue .stage-card{background:#eff6ff;border-color:#bfdbfe}.c-blue .stage-num{background:#2563eb}.c-blue .stage-name{color:#1e3a8a}
  .c-violet .stage-card{background:#f5f3ff;border-color:#ddd6fe}.c-violet .stage-num{background:#7c3aed}.c-violet .stage-name{color:#4c1d95}
  .c-purple .stage-card{background:#faf5ff;border-color:#e9d5ff}.c-purple .stage-num{background:#9333ea}.c-purple .stage-name{color:#581c87}
  .c-rose .stage-card{background:#fff1f2;border-color:#fecdd3}.c-rose .stage-num{background:#e11d48}.c-rose .stage-name{color:#881337}
  .c-red .stage-card{background:#fef2f2;border-color:#fecaca}.c-red .stage-num{background:#dc2626}.c-red .stage-name{color:#7f1d1d}

  .diff-easy{background:#dcfce7;color:#166534}
  .diff-mid{background:#fef9c3;color:#854d0e}
  .diff-hard{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     HOME PAGE
═══════════════════════════════════════════════════════════ -->
<div id="home">
  <div class="inner">
    <div class="hero">
      <div class="hero-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <h1>멜로디 시창 훈련</h1>
      <p class="hero-sub">1단계부터 9단계까지 — 기초에서 전문가 수준까지<br>악보를 보고 소리를 듣는 능력을 체계적으로 키우세요.</p>
      <div class="stats">
        <div class="stat"><div class="stat-val">54개</div><div class="stat-lbl">시창 연습</div></div>
        <div class="stat"><div class="stat-val">9단계</div><div class="stat-lbl">난이도</div></div>
        <div class="stat"><div class="stat-val">VexFlow</div><div class="stat-lbl">실제 악보</div></div>
      </div>
    </div>

    <div class="section-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      단계별 시창 훈련
    </div>
    <div class="stage-grid" id="stageGrid"></div>

    <p style="text-align:center;font-size:.7rem;color:#6366f1;margin-top:1rem">VexFlow 악보 렌더링 · Tone.js 오디오 · 브라우저에서 바로 재생</p>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     TRAINER PAGE
═══════════════════════════════════════════════════════════ -->
<div id="trainer">
  <div class="trainer-header">
    <div class="trainer-header-inner">
      <button class="home-btn" onclick="showHome()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        홈
      </button>
      <div class="header-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        멜로디 시창 훈련
      </div>
      <span class="stage-badge" id="headerBadge"></span>
    </div>
  </div>

  <div class="stage-banner" id="stageBanner">
    <div class="stage-banner-inner">
      <button class="banner-nav-btn" id="prevStageBtn" onclick="goPrevStage()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
        <span id="prevStageName">이전</span>
      </button>
      <div class="banner-center">
        <div class="banner-stage-name" id="bannerStageName"></div>
        <div class="banner-stage-sub" id="bannerStageSub"></div>
      </div>
      <button class="banner-nav-btn" id="nextStageBtn" onclick="goNextStage()">
        <span id="nextStageName">다음</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
      </button>
    </div>
    <div class="stage-dots" id="stageDots"></div>
  </div>

  <div class="trainer-body">
    <div class="stage-info-bar" id="stageInfoBar"></div>
    <div class="progress-row">
      <span id="progressLabel">문제 1 / 6</span>
      <span id="completedLabel">완료: 0 / 6</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:16%"></div></div>

    <div class="exercise-card">
      <div class="exercise-top">
        <div>
          <div class="exercise-title" id="exTitle"></div>
          <div class="exercise-desc" id="exDesc"></div>
        </div>
        <div class="bpm-tag" id="exBpm"></div>
      </div>
      <div class="sheet-wrap" id="sheetWrap">
        <div id="sheetContainer" style="width:100%"></div>
      </div>
      <div class="active-note-row" id="activeNoteRow"></div>
      <div class="controls">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span id="playLabel">들어보기</span>
        </button>
        <button class="tip-btn" id="tipBtn" onclick="toggleTip()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          팁
        </button>
      </div>
      <div id="tipBox" style="display:none" class="tip-box"></div>
    </div>

    <div class="note-list-card">
      <div class="note-list-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        음표 목록
      </div>
      <div class="note-grid" id="noteGrid"></div>
    </div>

    <div class="ex-nav">
      <button class="nav-btn" id="prevExBtn" onclick="goPrevEx()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        이전 문제
      </button>
      <div class="ex-dots" id="exDots"></div>
      <button class="nav-btn next-btn" id="nextExBtn" onclick="goNextEx()">
        다음 문제
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="completion-card" id="completionCard" style="display:none">
      <div class="completion-title" id="completionTitle"></div>
      <div class="completion-sub" id="completionSub"></div>
      <div class="completion-btns">
        <button class="comp-btn" id="nextStageCompBtn" onclick="goNextStage()" style="display:none"></button>
        <button class="comp-btn comp-btn-home" onclick="showHome()">홈으로</button>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  EXERCISE DATA
// ══════════════════════════════════════════════════════
function n(pitch,tonePitch,duration,extra={}){return{pitch,tonePitch,duration,...extra}}
const F4s=(d,x={})=>n("F/4","F#4",d,{accidental:"#",...x});
const C5s=(d,x={})=>n("C/5","C#5",d,{accidental:"#",...x});
const G4s=(d,x={})=>n("G/4","G#4",d,{accidental:"#",...x});
const D5s=(d,x={})=>n("D/5","D#5",d,{accidental:"#",...x});
const A4s=(d,x={})=>n("A/4","A#4",d,{accidental:"#",...x});
const Bb4=(d,x={})=>n("B/4","Bb4",d,{accidental:"b",...x});
const Eb4=(d,x={})=>n("E/4","Eb4",d,{accidental:"b",...x});
const Ab4=(d,x={})=>n("A/4","Ab4",d,{accidental:"b",...x});
const Gb4=(d,x={})=>n("G/4","Gb4",d,{accidental:"b",...x});
const Db4=(d,x={})=>n("D/4","Db4",d,{accidental:"b",...x});
const Bb3=(d,x={})=>n("B/3","Bb3",d,{accidental:"b",...x});
const Eb5=(d,x={})=>n("E/5","Eb5",d,{accidental:"b",...x});
const Ab5=(d,x={})=>n("A/5","Ab5",d,{accidental:"b",...x});
const Db5=(d,x={})=>n("D/5","Db5",d,{accidental:"b",...x});
const Gb5=(d,x={})=>n("G/5","Gb5",d,{accidental:"b",...x});
const C4s=(d,x={})=>n("C/4","C#4",d,{accidental:"#",...x});
const D4s=(d,x={})=>n("D/4","D#4",d,{accidental:"#",...x});
const G3s=(d,x={})=>n("G/3","G#3",d,{accidental:"#",...x});
const Ab3=(d,x={})=>n("A/3","Ab3",d,{accidental:"b",...x});
const Eb3=(d,x={})=>n("E/3","Eb3",d,{accidental:"b",...x});
const Gb3=(d,x={})=>n("G/3","Gb3",d,{accidental:"b",...x});

const stages=[
{id:"1",label:"1단계",sublabel:"입문",difficulty:"어려움",
 description:"점8분+16분+도약 · G장조 느낌 · 이미 음대 입시 수준",
 keyInfo:"G장조 느낌 · 점8분+16분 · BPM 76",color:"emerald",
 exercises:[
  {id:1,bpm:76,timeSignature:{num:4,den:4},koreanTitle:"솔라 시 라 레 — 점8분+16분 도약",description:"점8분(0.75박)+16분(0.25박)으로 시작해 점4분+8분+4분으로 마무리합니다.",tip:"점8분+16분 = 0.75+0.25 = 1박. 짧은 16분 뒤 빠르게 다음 음으로 넘어가세요!",
   notes:[n("G/4","G4","8",{dots:1}),n("A/4","A4","16"),n("B/4","B4","q",{dots:1}),n("A/4","A4","8"),n("D/5","D5","q")]},

  {id:54,bpm:96,timeSignature:{num:4,den:4},koreanTitle:"미♭ 레레♭도시 시♭ 라라♭솔파# 파 미 파# — 13음 절대 최고난도",description:"16분→32분×4→점8분→32분×4→점8분→16분→4분. 반음계 13음, 전문가도 어렵습니다!",tip:"Eb5에서 시작해 F#4에서 끝납니다(삼온음!). BPM 96에서 이 악보를 초견하면 최고 수준입니다.",
   notes:[Eb5("16"),n("D/5","D5","32"),Db5("32"),n("C/5","C5","32"),n("B/4","B4","32"),Bb4("8",{dots:1}),n("A/4","A4","32"),Ab4("32"),n("G/4","G4","32"),F4s("32"),n("F/4","F4","8",{dots:1}),n("E/4","E4","16"),F4s("q")]}
 ]}
];

// ══════════════════════════════════════════════════════
//  COLOR CONFIG
// ══════════════════════════════════════════════════════
const COLORS={
  emerald:{accent:"#059669",light:"#ecfdf5",border:"#a7f3d0",badge:"#d1fae5",badgeText:"#065f46",banner:"linear-gradient(90deg,#059669,#0d9488)",play:"#059669"},
  teal:{accent:"#0d9488",light:"#f0fdfa",border:"#99f6e4",badge:"#ccfbf1",badgeText:"#134e4a",banner:"linear-gradient(90deg,#0d9488,#0891b2)",play:"#0d9488"},
  cyan:{accent:"#0891b2",light:"#ecfeff",border:"#a5f3fc",badge:"#cffafe",badgeText:"#164e63",banner:"linear-gradient(90deg,#0891b2,#0284c7)",play:"#0891b2"},
  sky:{accent:"#0284c7",light:"#f0f9ff",border:"#bae6fd",badge:"#e0f2fe",badgeText:"#0c4a6e",banner:"linear-gradient(90deg,#0284c7,#2563eb)",play:"#0284c7"},
  blue:{accent:"#2563eb",light:"#eff6ff",border:"#bfdbfe",badge:"#dbeafe",badgeText:"#1e3a8a",banner:"linear-gradient(90deg,#2563eb,#7c3aed)",play:"#2563eb"},
  violet:{accent:"#7c3aed",light:"#f5f3ff",border:"#ddd6fe",badge:"#ede9fe",badgeText:"#4c1d95",banner:"linear-gradient(90deg,#7c3aed,#9333ea)",play:"#7c3aed"},
  purple:{accent:"#9333ea",light:"#faf5ff",border:"#e9d5ff",badge:"#f3e8ff",badgeText:"#581c87",banner:"linear-gradient(90deg,#9333ea,#e11d48)",play:"#9333ea"},
  rose:{accent:"#e11d48",light:"#fff1f2",border:"#fecdd3",badge:"#ffe4e6",badgeText:"#881337",banner:"linear-gradient(90deg,#e11d48,#dc2626)",play:"#e11d48"},
  red:{accent:"#dc2626",light:"#fef2f2",border:"#fecaca",badge:"#fee2e2",badgeText:"#7f1d1d",banner:"linear-gradient(90deg,#dc2626,#b91c1c)",play:"#dc2626"},
};

const NOTE_NAMES={"C/3":"도(C3)","D/3":"레(D3)","E/3":"미(E3)","F/3":"파(F3)","G/3":"솔(G3)","A/3":"라(A3)","B/3":"시(B3)","C/4":"도(C4)","D/4":"레(D4)","E/4":"미(E4)","F/4":"파(F4)","G/4":"솔(G4)","A/4":"라(A4)","B/4":"시(B4)","C/5":"도(C5)","D/5":"레(D5)","E/5":"미(E5)","F/5":"파(F5)","G/5":"솔(G5)"};
const DUR_KR={w:"온음표",h:"2분음표",q:"4분음표","8":"8분음표","16":"16분음표","32":"32분음표"};
const DUR_MAP={w:"1n",h:"2n",q:"4n","8":"8n","16":"16n","32":"32n"};
const BASE_BEATS={w:4,h:2,q:1,"8":.5,"16":.25,"32":.125};

// ══════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════
let currentStageIdx=0,currentExIdx=0,showTip=false,isPlaying=false,activeNoteIdx=null;
let completedExes=new Set();
let timeouts=[],synth=null;

// ══════════════════════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════════════════════
function getDurSecs(dur,dots,bpm){
  let b=BASE_BEATS[dur]??1;
  if(dots===1)b*=1.5;
  return b*(60/bpm);
}
function stopAudio(){
  timeouts.forEach(clearTimeout);timeouts=[];
  if(synth){try{synth.triggerRelease();}catch{}}
  isPlaying=false;activeNoteIdx=null;
  updatePlayBtn();updateActiveNote();renderSheet();
}
async function playNotes(notes,bpm){
  stopAudio();
  await Tone.start();
  if(!synth)synth=new Tone.Synth({oscillator:{type:"triangle"},envelope:{attack:.02,decay:.1,sustain:.6,release:.5}}).toDestination();
  isPlaying=true;updatePlayBtn();
  let t=0;
  notes.forEach((note,idx)=>{
    const dots=note.dots??0;
    const durSecs=getDurSecs(note.duration,dots,bpm);
    const toneNote=(DUR_MAP[note.duration]??"4n")+(dots>0?".":"");
    timeouts.push(setTimeout(()=>{
      activeNoteIdx=idx;
      updateActiveNote();renderSheet();
      try{synth.triggerAttackRelease(note.tonePitch,toneNote);}catch{}
    },t*1000));
    t+=durSecs;
  });
  timeouts.push(setTimeout(()=>{
    isPlaying=false;activeNoteIdx=null;
    updatePlayBtn();updateActiveNote();renderSheet();
  },t*1000+200));
}
function togglePlay(){
  if(isPlaying){stopAudio();return;}
  const stage=stages[currentStageIdx];
  const ex=stage.exercises[currentExIdx];
  completedExes.add(currentExIdx);
  updateProgress();updateExDots();updateCompletion();
  playNotes(ex.notes,ex.bpm);
}

// ══════════════════════════════════════════════════════
//  SHEET MUSIC
// ══════════════════════════════════════════════════════
function renderSheet(){
  const stage=stages[currentStageIdx];
  const ex=stage.exercises[currentExIdx];
  const c=document.getElementById("sheetContainer");
  if(!c)return;
  c.innerHTML="";
  if(!window.Vex){c.textContent="VexFlow 로딩 중...";return;}
  try{
    const{Renderer,Stave,StaveNote,Voice,Formatter,Accidental,Beam}=Vex.Flow;
    const w=Math.min(c.offsetWidth||640,680);
    const renderer=new Renderer(c,Renderer.Backends.SVG);
    renderer.resize(w,190);
    const ctx=renderer.getContext();
    ctx.setFont("Arial",12);
    const stave=new Stave(10,40,w-20);
    stave.addClef("treble");
    stave.addTimeSignature(`${ex.timeSignature.num}/${ex.timeSignature.den}`);
    stave.setContext(ctx).draw();
    const sns=ex.notes.map((note,idx)=>{
      let dur=note.duration;
      if(note.dots)dur+=`d`;
      const sn=new StaveNote({keys:[note.pitch],duration:dur,clef:"treble"});
      if(note.accidental)sn.addModifier(new Accidental(note.accidental),0);
      const active=(idx===activeNoteIdx);
      sn.setStyle({fillStyle:active?"#7c3aed":"#1e293b",strokeStyle:active?"#7c3aed":"#1e293b"});
      return sn;
    });
    const voice=new Voice({num_beats:ex.timeSignature.num,beat_value:ex.timeSignature.den});
    voice.setStrict(false);
    voice.addTickables(sns);
    new Formatter().joinVoices([voice]).format([voice],w-120);
    const beams=Beam.generateBeams(sns,{groups:[new Vex.Flow.Fraction(2,8)],stem_direction:1});
    voice.draw(ctx,stave);
    beams.forEach(b=>b.setContext(ctx).draw());
  }catch(e){c.textContent="악보 렌더링 오류: "+e.message;}
}

// ══════════════════════════════════════════════════════
//  UI UPDATE
// ══════════════════════════════════════════════════════
function updatePlayBtn(){
  const btn=document.getElementById("playBtn");
  const icon=document.getElementById("playIcon");
  const lbl=document.getElementById("playLabel");
  const stage=stages[currentStageIdx];
  const c=COLORS[stage.color];
  btn.style.background=c.play;
  if(isPlaying){
    icon.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    lbl.textContent="정지";
  }else{
    icon.innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
    lbl.textContent="들어보기";
  }
}
function updateActiveNote(){
  const row=document.getElementById("activeNoteRow");
  const stage=stages[currentStageIdx];
  const ex=stage.exercises[currentExIdx];
  const c=COLORS[stage.color];
  if(activeNoteIdx!==null&&activeNoteIdx<ex.notes.length){
    const note=ex.notes[activeNoteIdx];
    const name=NOTE_NAMES[note.pitch]??note.pitch;
    const acc=note.accidental?(note.accidental==="#"?" (올림♯)":" (내림♭)"):"";
    const dur=DUR_KR[note.duration]??note.duration;
    const dot=note.dots?" (점)":"";
    row.innerHTML=`<span style="color:${c.accent}">▶ ${name}${acc} — ${dur}${dot}</span>`;
  }else{
    row.innerHTML="";
  }
}
function updateProgress(){
  const stage=stages[currentStageIdx];
  const total=stage.exercises.length;
  const c=COLORS[stage.color];
  document.getElementById("progressLabel").textContent=`문제 ${currentExIdx+1} / ${total}`;
  document.getElementById("completedLabel").textContent=`완료: ${completedExes.size} / ${total}`;
  const fill=document.getElementById("progressFill");
  fill.style.width=`${((currentExIdx+1)/total)*100}%`;
  fill.style.background=c.accent;
}
function updateExDots(){
  const stage=stages[currentStageIdx];
  const c=COLORS[stage.color];
  const container=document.getElementById("exDots");
  container.innerHTML=stage.exercises.map((_,i)=>
    `<button class="ex-dot${i===currentExIdx?" active":""}" onclick="goToEx(${i})" style="background:${i===currentExIdx?c.accent:completedExes.has(i)?c.accent+"66":"#cbd5e1"};${i===currentExIdx?"transform:scale(1.35)":""}"></button>`
  ).join("");
}
function updateStageDots(){
  const container=document.getElementById("stageDots");
  container.innerHTML=stages.map((s,i)=>
    `<button class="stage-dot${i===currentStageIdx?" active":""}" onclick="goToStage(${i})" title="${s.label}"></button>`
  ).join("");
}
function updateNoteGrid(){
  const stage=stages[currentStageIdx];
  const ex=stage.exercises[currentExIdx];
  const c=COLORS[stage.color];
  const grid=document.getElementById("noteGrid");
  grid.innerHTML=ex.notes.map((note,idx)=>{
    const active=idx===activeNoteIdx;
    const name=NOTE_NAMES[note.pitch]??note.pitch;
    const acc=note.accidental?(note.accidental==="#"?"♯":"♭"):"";
    const dur=DUR_KR[note.duration]??note.duration;
    const dot=note.dots?" (점)":"";
    const bg=active?c.badge:"#f8fafc";
    const border=active?c.accent:"#e2e8f0";
    const textColor=active?c.badgeText:"#475569";
    return `<div class="note-chip${active?" active":""}" style="background:${bg};border-color:${border};color:${textColor}">
      <span class="note-chip-num">${idx+1}.</span>
      <div class="note-chip-name">${name}${acc?`<span style="font-weight:700;margin-left:2px">${acc}</span>`:""}</div>
      <div class="note-chip-dur">${dur}${dot}</div>
    </div>`;
  }).join("");
}
function updateTip(){
  const stage=stages[currentStageIdx];
  const ex=stage.exercises[currentExIdx];
  const c=COLORS[stage.color];
  const tipBox=document.getElementById("tipBox");
  const tipBtn=document.getElementById("tipBtn");
  tipBox.style.display=showTip?"flex":"none";
  if(showTip){
    tipBox.style.background=c.light;
    tipBox.style.borderColor=c.border;
    tipBox.style.color=c.accent;
    tipBox.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><p>${ex.tip}</p>`;
  }
  tipBtn.className="tip-btn"+(showTip?" open":"");
  if(showTip)tipBtn.style.color=c.accent;else tipBtn.style.color="";
}
function updateCompletion(){
  const stage=stages[currentStageIdx];
  const total=stage.exercises.length;
  const c=COLORS[stage.color];
  const card=document.getElementById("completionCard");
  if(completedExes.size===total){
    card.style.display="block";
    card.style.background=c.light;
    card.style.borderColor=c.border;
    document.getElementById("completionTitle").style.color=c.accent;
    document.getElementById("completionTitle").textContent=`${stage.label} 완료! 🎉`;
    const nextStage=stages[currentStageIdx+1];
    document.getElementById("completionSub").textContent=
      nextStage?`모든 ${total}개 문제를 완료했습니다. ${nextStage.label}에 도전해보세요!`
               :`모든 ${total}개 문제를 완료했습니다. 최고 단계까지 완주했습니다!`;
    const nextBtn=document.getElementById("nextStageCompBtn");
    if(nextStage){
      nextBtn.style.display="inline-block";
      nextBtn.style.background=c.play;
      nextBtn.textContent=`${nextStage.label} 도전 ▶`;
    }else{
      nextBtn.style.display="none";
    }
  }else{
    card.style.display="none";
  }
}
function updateBanner(){
  const stage=stages[currentStageIdx];
  const c=COLORS[stage.color];
  const banner=document.getElementById("stageBanner");
  banner.style.background=c.banner;
  document.getElementById("bannerStageName").textContent=stage.label;
  document.getElementById("bannerStageSub").textContent=`${stage.sublabel} · ${stage.difficulty}`;
  document.getElementById("headerBadge").textContent=stage.label;
  document.getElementById("headerBadge").style.background=c.badge;
  document.getElementById("headerBadge").style.color=c.badgeText;
  const prevStage=stages[currentStageIdx-1];
  const nextStage=stages[currentStageIdx+1];
  const prevBtn=document.getElementById("prevStageBtn");
  const nextBtn=document.getElementById("nextStageBtn");
  prevBtn.disabled=!prevStage;
  nextBtn.disabled=!nextStage;
  document.getElementById("prevStageName").textContent=prevStage?prevStage.label:"이전";
  document.getElementById("nextStageName").textContent=nextStage?nextStage.label:"다음";
  const infoBar=document.getElementById("stageInfoBar");
  infoBar.style.background=c.light;
  infoBar.style.borderColor=c.border;
  infoBar.innerHTML=`<span style="font-weight:700;color:${c.accent}">${stage.keyInfo}</span><span style="color:#94a3b8;margin:0 .5rem">·</span><span style="color:#475569">${stage.description}</span>`;
  const nextExBtn=document.getElementById("nextExBtn");
  nextExBtn.style.background=c.play;
}
function updateExercise(){
  const stage=stages[currentStageIdx];
  const ex=stage.exercises[currentExIdx];
  const c=COLORS[stage.color];
  document.getElementById("exTitle").textContent=ex.koreanTitle;
  document.getElementById("exDesc").textContent=ex.description;
  document.getElementById("exBpm").textContent=`BPM ${ex.bpm}`;
  const wrap=document.getElementById("sheetWrap");
  wrap.style.background=c.light;
  wrap.style.borderColor=c.border;
  const prevBtn=document.getElementById("prevExBtn");
  const nextBtn=document.getElementById("nextExBtn");
  prevBtn.disabled=currentExIdx===0;
  nextBtn.disabled=currentExIdx===stage.exercises.length-1;
}
function refreshAll(){
  updateBanner();
  updateStageDots();
  updateProgress();
  updateExercise();
  updateTip();
  updateActiveNote();
  updateNoteGrid();
  updateExDots();
  updatePlayBtn();
  updateCompletion();
  setTimeout(renderSheet,50);
}

// ══════════════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════════════
function goToStage(idx){
  stopAudio();
  currentStageIdx=idx;currentExIdx=0;showTip=false;completedExes=new Set();
  refreshAll();
}
function goToEx(idx){
  stopAudio();currentExIdx=idx;showTip=false;refreshAll();
}
function goPrevStage(){if(currentStageIdx>0)goToStage(currentStageIdx-1);}
function goNextStage(){if(currentStageIdx<stages.length-1)goToStage(currentStageIdx+1);}
function goPrevEx(){if(currentExIdx>0)goToEx(currentExIdx-1);}
function goNextEx(){
  const stage=stages[currentStageIdx];
  if(currentExIdx<stage.exercises.length-1)goToEx(currentExIdx+1);
}
function toggleTip(){showTip=!showTip;updateTip();}

function showHome(){
  stopAudio();
  document.getElementById("home").style.display="flex";
  document.getElementById("trainer").classList.remove("active");
}
function showTrainer(stageIdx){
  stopAudio();
  currentStageIdx=stageIdx;currentExIdx=0;showTip=false;completedExes=new Set();activeNoteIdx=null;
  document.getElementById("home").style.display="none";
  document.getElementById("trainer").classList.add("active");
  refreshAll();
}

// ══════════════════════════════════════════════════════
//  HOME BUILD
// ══════════════════════════════════════════════════════
function buildHome(){
  const grid=document.getElementById("stageGrid");
  const DIFF_IDX_COLOR=(i)=>i<3?"diff-easy":i<6?"diff-mid":"diff-hard";
  grid.innerHTML=stages.map((s,i)=>{
    const c=COLORS[s.color];
    return `<div class="c-${s.color}">
      <button class="stage-card" onclick="showTrainer(${i})" style="background:${c.light};border-color:${c.border}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem">
          <div class="stage-num" style="background:${c.accent}">${s.id}</div>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="${c.accent}" stroke-width="2.5" style="opacity:.5;margin-top:4px"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="stage-name" style="color:${c.accent}">${s.label} <span style="font-weight:400;font-size:.75rem;opacity:.7">${s.sublabel}</span></div>
        <div class="stage-info">${s.keyInfo}</div>
        <div><span class="diff-badge ${DIFF_IDX_COLOR(i)}">${s.difficulty}</span></div>
      </button></div>`;
  }).join("");
}

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
window.addEventListener("resize",()=>{if(document.getElementById("trainer").classList.contains("active"))renderSheet();});
buildHome();
</script>
