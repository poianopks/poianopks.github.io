  icons.forEach(function(m,j){var on=sc==="phone"&&lt>1.6+j*1.4;m.visible=on;if(on){var e=back((lt-1.6-j*1.4)/.6);m.position.set(phone.position.x+(j%2?1:-1)*2.4*e,phone.position.y+2.0-j*1.7+Math.sin(t*2+j)*.12,phone.position.z+1.2);m.scale.setScalar(Math.max(.01,e));m.rotation.set(t*.8+j,t*1.1+j,0);}});
  /* 파일 흐름 */
  var path=null;if(sc==="cloud")path=[cloud.position,phone.position];else if(sc==="vault")path=[cloud.position,vault.position,lap.position];else if(sc==="github")path=[cloud.position,vault.position];
  files.forEach(function(f,j){if(!path){f.visible=false;return;}f.visible=true;var u=((lt*.42+j/files.length)%1)*(path.length-1),s=Math.floor(u),fr=u-s;
    f.position.lerpVectors(path[s],path[Math.min(s+1,path.length-1)],fr);f.position.y+=Math.sin(fr*Math.PI)*1.4;f.rotation.set(t*2+j,t*1.6,0);});
  spark.visible=sc==="github"||sc==="outro";spark.position.copy(sc==="github"?vault.position:cloud.position);
  spark.children.forEach(function(s){var d=s.userData,a=d.a+t*1.4;s.position.set(Math.cos(a)*d.r,d.y*.5+Math.sin(t*2+d.a)*.3,Math.sin(a)*d.r);s.rotation.y=t*3;});
  $("flash").style.opacity=sc==="github"&&lt<.45?(.45-lt)*1.4:0;
  $("cap").style.transform="translateY("+(1-ease(lt/.4))*20+"px)";$("cap").style.opacity=ease(lt/.3);
  drawKb(t);
  R.render(scene,cam);
}
