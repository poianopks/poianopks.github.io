// ---- original music: bright 104bpm, F major ----
var SAMP=["C2","Ds2","Fs2","A2","C3","Ds3","Fs3","A3","C4","Ds4","Fs4","A4","C5","Ds5","Fs5","A5","C6"];
function nm2m(n){var pc={C:0,Ds:3,Fs:6,A:9}[n.replace(/\d/,"")];return 12*(+n.match(/\d/)[0]+1)+pc;}
function notes(){var N=[],b=60/104,prog=[[41,53,57,60],[46,53,58,62],[48,55,60,64],[41,53,57,60]],mel=[69,72,74,72,70,69,67,65,67,69,70,72,74,72,69,72];
  for(var bar=0;bar<13;bar++){var t0=0.25+bar*4*b,ch=prog[bar%4];N.push([t0,ch[0]-12,4*b,.3]);for(var k=0;k<8;k++)N.push([t0+k*b/2,ch[1+(k%3)],b*.45,.13]);
    if(bar<12){var m1=mel[(bar*2)%16],m2=mel[(bar*2+1)%16];N.push([t0,m1,1.5*b,.42]);N.push([t0+1.5*b,m1+2,.5*b,.32]);N.push([t0+2*b,m2,2*b,.4]);}else N.push([t0,77,5*b,.45]);}
  return N;}
function render(){var SR=44100,oc=new OfflineAudioContext(2,Math.ceil((TOTAL+1)*SR),SR),bufs={};
  return Promise.all(SAMP.map(function(nm){return fetch("https://tonejs.github.io/audio/salamander/"+nm+".mp3").then(function(r){return r.arrayBuffer();}).then(function(b){return oc.decodeAudioData(b);}).then(function(ab){bufs[nm2m(nm)]=ab;});})).then(function(){
    var ks=Object.keys(bufs).map(Number);var irb=oc.createBuffer(2,SR*2.2,SR);for(var c=0;c<2;c++){var d=irb.getChannelData(c);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);}var cv=oc.createConvolver();cv.buffer=irb;var bus=oc.createGain(),wet=oc.createGain();wet.gain.value=.25;bus.connect(oc.destination);bus.connect(cv);cv.connect(wet);wet.connect(oc.destination);
    notes().forEach(function(n){if(n[0]>TOTAL-0.3)return;var s=ks.reduce(function(a,k){return Math.abs(k-n[1])<Math.abs(a-n[1])?k:a;},ks[0]);var src=oc.createBufferSource();src.buffer=bufs[s];src.playbackRate.value=Math.pow(2,(n[1]-s)/12);var g=oc.createGain();g.gain.setValueAtTime(n[3],n[0]);g.gain.setValueAtTime(n[3],n[0]+n[2]);g.gain.exponentialRampToValueAtTime(.001,n[0]+n[2]+.5);src.connect(g);g.connect(bus);src.start(n[0]);src.stop(n[0]+n[2]+.6);});
    return oc.startRendering();});}
