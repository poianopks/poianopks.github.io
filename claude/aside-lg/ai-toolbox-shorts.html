  T((k+1)+". "+tl.e+" "+tl.n,W/2,1530,"900 70px "+FN,tl.c);T(tl.d,W/2,1610,"800 48px "+FN,"#fff");T("("+tl.k+")",W/2,1668,"700 36px "+FN,"rgba(255,255,255,.7)");}
function sceneConn(t){ // 14.2-21.2 (7s)
  T("🔌 AI가 손잡는 3가지 길",W/2,160,"900 66px "+FN,"#ffe082","#000",10);
  var rows=[{n:"MCP",s:"만능 콘센트",d:"꽂기만 하면 여러 앱과 대화",c:"#a5d6a7",y:340},{n:"CLI",s:"글자 명령 창",d:"까만 창에 명령 한 줄",c:"#ffcc80",y:830},{n:"API",s:"주문 창구",d:"정해진 양식으로 주문서",c:"#90caf9",y:1320}];
  var k=Math.min(2,Math.floor(t/2.3)),u=(t%2.3)/2.3;
  rows.forEach(function(r,i){var on=i===k,al=i<=k?1:.25;X.globalAlpha=al;X.fillStyle=on?"rgba(255,255,255,.1)":"rgba(255,255,255,.05)";rr(60,r.y,960,420,36);X.fill();
    X.fillStyle=r.c;rr(100,r.y+40,220,80,40);X.fill();T(r.n,210,r.y+97,"900 50px "+FN,"#102");T(r.s,560,r.y+100,"900 56px "+FN,r.c,"#000",6,"left");T(r.d,W/2,r.y+370,"800 40px "+FN,"#fff");
    X.fillStyle="#2a1f55";rr(110,r.y+160,150,140,24);X.fill();T("🤖",185,r.y+262,"80px "+FN,"#fff");
    if(i===0){["📧","🎬","📝"].forEach(function(e,j){var ax=880,ay=r.y+150+j*65;var lit=i<k||(on&&u>j*.25);X.strokeStyle=lit?r.c:"rgba(255,255,255,.2)";X.lineWidth=8;X.beginPath();X.moveTo(260,r.y+230);X.bezierCurveTo(560,r.y+230,600,ay+20,ax-40,ay+20);X.stroke();T(e,ax,ay+40,"52px "+FN,"#fff");});}
    if(i===1){X.fillStyle="#000";rr(320,r.y+160,640,150,18);X.fill();var cmd="> ffmpeg -i 사진.jpg 영상.mp4";var n=i<k?cmd.length:on?Math.floor(cmd.length*Math.min(1,u*1.5)):0;T(cmd.slice(0,n)+(on&&Math.floor(t*3)%2?"▌":""),345,r.y+230,"700 36px Consolas,monospace","#7CFC00",null,0,"left");if(i<k||(on&&u>.7))T("✔ 완료!",345,r.y+285,"800 34px "+FN,"#a7f3d0",null,0,"left");}

// ---- original music (Salamander = Yamaha C5) ----
var SAMP=["C2","Ds2","Fs2","A2","C3","Ds3","Fs3","A3","C4","Ds4","Fs4","A4","C5","Ds5","Fs5","A5","C6"];
function nm2m(n){var pc={C:0,Ds:3,Fs:6,A:9}[n.replace(/\d/,"")];return 12*(+n.match(/\d/)[0]+1)+pc;}
function notes(){var N=[],bpm=96,b=60/bpm,prog=[[48,55,64],[43,50,59],[45,52,60],[41,48,57]],mel=[72,74,76,79,77,76,74,72,71,72,74,76,72,69,71,72];
  for(var bar=0;bar<12;bar++){var t0=0.3+bar*4*b,ch=prog[bar%4];N.push([t0,ch[0]-12,4*b,.32]);for(var k=0;k<4;k++){N.push([t0+k*b,ch[1+(k%2)],b*.9,.18]);}
    var m1=mel[(bar*2)%16],m2=mel[(bar*2+1)%16];if(bar<11){N.push([t0,m1,2*b,.42]);N.push([t0+2*b,m2,1.5*b,.38]);N.push([t0+3.5*b,m2+(bar%2?2:-1),.5*b,.3]);}else N.push([t0,72,6*b,.45]);}
  return N;}
function render(){var SR=44100,oc=new OfflineAudioContext(2,Math.ceil((TOTAL+1)*SR),SR),bufs={};
  return Promise.all(SAMP.map(function(nm){return fetch("https://tonejs.github.io/audio/salamander/"+nm+".mp3").then(function(r){return r.arrayBuffer();}).then(function(b){return oc.decodeAudioData(b);}).then(function(ab){bufs[nm2m(nm)]=ab;});})).then(function(){
    var ks=Object.keys(bufs).map(Number);var irb=oc.createBuffer(2,SR*2.5,SR);for(var c=0;c<2;c++){var d=irb.getChannelData(c);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);}var cv=oc.createConvolver();cv.buffer=irb;var bus=oc.createGain(),wet=oc.createGain();wet.gain.value=.3;bus.connect(oc.destination);bus.connect(cv);cv.connect(wet);wet.connect(oc.destination);
    notes().forEach(function(n){var s=ks.reduce(function(a,k){return Math.abs(k-n[1])<Math.abs(a-n[1])?k:a;},ks[0]);var src=oc.createBufferSource();src.buffer=bufs[s];src.playbackRate.value=Math.pow(2,(n[1]-s)/12);var g=oc.createGain();g.gain.setValueAtTime(n[3],n[0]);g.gain.setValueAtTime(n[3],n[0]+n[2]);g.gain.exponentialRampToValueAtTime(.001,n[0]+n[2]+.6);src.connect(g);g.connect(bus);src.start(n[0]);src.stop(n[0]+n[2]+.7);});
    return oc.startRendering();});}
window.SH={frame:frame,total:TOTAL,renderAudio:render};
