function frame(t){var act=place(t);r3.render(scene,cam);X.drawImage(r3.domElement,0,0,W,H3);drawHud(t,act);drawScore(t);}
// ---- audio ----
var SAMP=["A0","C1","Ds1","Fs1","A1","C2","Ds2","Fs2","A2","C3","Ds3","Fs3","A3","C4","Ds4","Fs4","A4","C5","Ds5","Fs5","A5","C6","Ds6","Fs6","A6","C7","Ds7","Fs7","A7","C8"];
function nm2m(n){var pc={C:0,Ds:3,Fs:6,A:9}[n.replace(/\d/,"")];return 12*(+n.match(/\d/)[0]+1)+pc;}
function schedule(ctx,dest,bufs,t0){var ks=Object.keys(bufs).map(Number).sort(function(a,b){return a-b;});
  N.forEach(function(n){if(!ks.length)return;var s=ks[0];ks.forEach(function(k){if(Math.abs(k-n.m)<Math.abs(s-n.m))s=k;});var src=ctx.createBufferSource();src.buffer=bufs[s];src.playbackRate.value=Math.pow(2,(n.m-s)/12);
    var v=n.h==="R"?(n.tr?.42:.6):.3;var g=ctx.createGain(),t=t0+n.t0,rel=t0+Math.max(n.t0+.08,n.te);g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,rel);g.gain.exponentialRampToValueAtTime(.0008,rel+.6);src.connect(g);g.connect(dest);src.start(t);src.stop(rel+.65);});}
function chain(ctx){var SR=ctx.sampleRate,ir=ctx.createBuffer(2,SR*2.8,SR);for(var c=0;c<2;c++){var d=ir.getChannelData(c);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);}var conv=ctx.createConvolver();conv.buffer=ir;var bus=ctx.createGain(),wet=ctx.createGain(),dry=ctx.createGain();wet.gain.value=.28;dry.gain.value=.9;var comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;bus.connect(dry);bus.connect(conv);conv.connect(wet);dry.connect(comp);wet.connect(comp);comp.connect(ctx.destination);return bus;}
function loadBufs(ctx,base){var bufs={};return Promise.all(SAMP.map(function(nm){return fetch((base||"https://tonejs.github.io/audio/salamander/")+nm+".mp3").then(function(r){return r.arrayBuffer();}).then(function(b){return ctx.decodeAudioData(b);}).then(function(ab){bufs[nm2m(nm)]=ab;}).catch(function(){});})).then(function(){return bufs;});}
// ---- public API (for video capture) ----
window.SH={ready:buildScore(),frame:frame,total:TOTAL,
  renderAudio:function(){var SR=44100,oc=new OfflineAudioContext(2,Math.ceil((TOTAL+1)*SR),SR);return loadBufs(oc).then(function(b){schedule(oc,chain(oc),b,0);return oc.startRendering();});}};
// ---- live player: starts by itself ----
var LV={ctx:null,t0:0,bufs:null,sound:false,start:0};
function now(){return LV.ctx&&LV.sound?LV.ctx.currentTime-LV.t0:(performance.now()-LV.start)/1000;}
function loop(){var t=now();if(t>=TOTAL){restart();t=0;}frame(Math.max(0,t));requestAnimationFrame(loop);}
function startSound(){if(LV.sound||!LV.ctx||!LV.bufs)return;if(LV.ctx.state!=="running")return;var t=(performance.now()-LV.start)/1000;LV.dest=LV.dest||chain(LV.ctx);LV.t0=LV.ctx.currentTime-t;schedule(LV.ctx,LV.dest,LV.bufs,LV.t0);LV.sound=true;document.getElementById("tap").style.display="none";}
function restart(){LV.start=performance.now();if(LV.sound){LV.t0=LV.ctx.currentTime+.1;schedule(LV.ctx,LV.dest,LV.bufs,LV.t0);}}
window.SH.ready.then(function(){LV.start=performance.now();requestAnimationFrame(loop);
  try{LV.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  if(LV.ctx){loadBufs(LV.ctx).then(function(b){LV.bufs=b;if(LV.ctx.state==="running")startSound();else{LV.ctx.resume().then(startSound).catch(function(){});setTimeout(function(){if(!LV.sound)document.getElementById("tap").style.display="block";},600);}});}
  var unlock=function(){if(!LV.ctx)return;LV.ctx.resume().then(function(){startSound();});};document.addEventListener("pointerdown",unlock);document.addEventListener("keydown",unlock);});

})();
