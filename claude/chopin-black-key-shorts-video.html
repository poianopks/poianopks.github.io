  red.intensity=1.5*shake+.3;
  /* 떨어지는 흑건 조각: 하늘에서 돌며 내려와 건반에 '탁' 닿고 사라짐 */
  var used=0;
  for(i=0;i<NP;i++){n=NOTES[i];var d=n[0]-t;if(d>LOOK)break;if(d<-.18)continue;
    var g=bar(used++),u=g.userData,wk=n[3]==="W",bk=isB(n[2]),dd=Math.max(0,d),fall=dd/LOOK;
    var y=(bk?.75:.35)+Math.pow(fall,1.15)*FALL;
    var sq=d<0?1+(-d)/.18*.6:1;                /* 닿으면 납작해지며 사라짐 */
    g.visible=true;g.position.set(X[n[2]],y,bk?1.9:3.0);
    g.rotation.set(fall*2.2*(rnd(i,11)-.5),fall*3*(rnd(i,12)-.5),fall*1.6*(rnd(i,13)-.5));

    u.strip.color.copy(COL[n[3]]);u.strip.emissive.copy(COL[n[3]]);u.strip.opacity=op;}

  /* 건반 */
  for(var mm in KEYS){var k=KEYS[mm],h2=down[mm];k.position.y=h2?k.userData.y-.15:k.userData.y;

  /* 불꽃: 최근 친 음에서 튀어 오름 */
  var si=0;for(i=0;i<NP&&si<SP;i++){n=NOTES[i];var a=t-n[0];if(a<0)break;if(a>1.1)continue;
    for(var q=0;q<4&&si<SP;q++,si++){var vx=(rnd(i,q)-.5)*6,vy=4+rnd(i,q+9)*8*(.4+n[4]),vz=(rnd(i,q+3)-.5)*3;
      spP[si*3]=X[n[2]]+vx*a;spP[si*3+1]=.8+vy*a-9*a*a;spP[si*3+2]=2.6+vz*a;var c=n[3]==="W"?COL.W:new THREE.Color(0xdff0ff),f=Math.max(0,1-a/1.1);spC[si*3]=c.r*f;spC[si*3+1]=c.g*f;spC[si*3+2]=c.b*f;}}
  for(;si<SP;si++){spP[si*3+1]=-99;}
  spG.attributes.position.needsUpdate=true;spG.attributes.color.needsUpdate=true;
  /* 속도선 */
  var sp=8+p*30;for(i=0;i<SL;i++){var z=-60+((rnd(i,7)*80+t*sp)%80),x=(rnd(i,8)-.5)*90,y=rnd(i,9)*30+2;
    slP[i*6]=x;slP[i*6+1]=y;slP[i*6+2]=z;slP[i*6+3]=x;slP[i*6+4]=y;slP[i*6+5]=z+2+p*5;}
  slG.attributes.position.needsUpdate=true;lines.material.opacity=.15+.4*p;

  var ch=CH[ci2],f=t<B.t0?0:Math.min(1,(t-B.t0)/(B.t1-B.t0)),lb=(bi-ch.a)*2+2*f,x=ch.left+curX(ch,lb)*ch.sc;
  $("cur").style.left=(x-3)+"px";$("cur").style.top=(ch.top+6)+"px";$("cur").style.height=(ch.h*ch.sc-12)+"px";$("cur").style.display=t<INTRO-0.3||t>END?"none":"block";
  ch.its.forEach(function(it){it.el.classList.toggle("on",t>=INTRO&&lb>=it.a-1e-6&&lb<it.b-1e-6);});
  $("barno").textContent=NONE?String(B.bar):EN?"Bar "+B.bar:B.bar+"마디";
  var ci=0;for(i=0;i<CAP.length;i++)if(bi>=CAP[i][0])ci=i;$("cap").textContent=t<INTRO||NONE?"":CAP[ci][1];

    var n3=Math.ceil(INTRO-.6-t);$("ovIn").innerHTML=NONE?'<h1>Chopin<br>«Black Key»</h1><p style="font-size:110px">⚫⚫⚫ ⚪?</p>'+(n3>0?'<p style="font-size:120px;color:#ffd166;margin-top:20px">'+n3+'</p>':''):(EN?'<p style="color:#cfd8ff">The right hand plays only black keys…</p><h1>Chopin<br>«Black Key»</h1><p>⚪ except ONE white key. Can you spot it?</p>':'<p style="color:#cfd8ff">오른손은 검은 건반만 쳐요… 단 한 번만 빼고!</p><h1>쇼팽<br>「흑건」</h1><p>⚪ 흰 건반 한 번, 찾을 수 있나요?</p>')+(n3>0?'<p style="font-size:120px;color:#ffd166;margin-top:30px">'+n3+'</p>':'');}
  else if(t>END){ov.style.display="grid";var o=Math.min(1,(t-END)/.8);ov.style.background="rgba(5,3,12,"+(.85*o)+")";ov.style.opacity=o;
    var CR='Score &amp; MIDI: Mutopia Project (Roland Goretzki, after Peters 1900) — public domain<br>Piano: Salamander Grand Piano (CC BY 3.0)';
    $("ovIn").innerHTML=NONE?'<h1 style="font-size:110px">⚪ = 1</h1><p style="font-size:44px;color:#ffd166">poianopks.github.io/claude</p><small>'+CR+' · © Sungsil Piano</small>':EN?'<h1 style="font-size:80px">⚪ Did you<br>spot it? (bar 66)</h1><p>🎹 Free lesson: all 85 bars, slow motion</p><p style="font-size:38px;color:#ffd166">poianopks.github.io/claude</p><small>'+CR+'<br>© Sungsil Piano · Piano technician Park Geunseong (Korea)</small>':'<h1 style="font-size:80px">⚪ 찾으셨나요?<br>66마디의 「파」!</h1><p>🎹 전곡 85마디 무료 공부 교실</p><p style="font-size:38px;color:#ffd166">poianopks.github.io/claude</p><small>악보·MIDI: Mutopia Project (Roland Goretzki, Peters 1900년판 바탕) — 퍼블릭 도메인<br>피아노 음색: Salamander Grand Piano (CC BY 3.0)<br>ⓒ 성실피아노 · 피아노조율사 박근성</small>';}
  else ov.style.display="none";
}
