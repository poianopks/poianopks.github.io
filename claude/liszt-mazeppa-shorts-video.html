<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>마제파 클라이맥스 쇼츠 — 3D 화면</title>
<meta name="robots" content="noindex"/>
<style>
html,body{margin:0;background:#05030c}
body{display:grid;place-items:center;min-height:100vh}
#wrap{position:relative;width:100%;max-width:440px;aspect-ratio:9/16;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:radial-gradient(ellipse at 50% 30%,#3a0f1a 0%,#14060f 55%,#05030c 100%)}
#gl{position:absolute;left:0;top:130px;width:1080px;height:1060px}
#top{position:absolute;left:0;top:0;width:1080px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(rgba(5,3,12,.95),rgba(5,3,12,.3));color:#ffd166;font-weight:900}
#top .a{font-size:44px}#top .b{font-size:30px;color:#ffc9b0;margin-top:2px}
#score{position:absolute;left:20px;top:1195px;width:1040px;height:370px;background:#fffaf2;border-radius:22px;overflow:hidden;box-shadow:0 0 0 5px #c21f35,0 12px 40px rgba(0,0,0,.6)}
#score img{position:absolute;left:0;width:1040px;display:none}
#score img.on{display:block}
#hl{position:absolute;background:rgba(255,209,102,.35);border-radius:8px}
#cur{position:absolute;width:6px;background:#e0413a;box-shadow:0 0 12px #e0413a;border-radius:3px}
#barno{position:absolute;right:16px;top:10px;background:#c21f35;color:#fff;font-weight:900;font-size:28px;border-radius:14px;padding:4px 14px}
#cap{position:absolute;left:40px;right:40px;top:1585px;text-align:center;color:#fff;font-size:44px;font-weight:900;line-height:1.3;text-shadow:0 3px 0 #5a0d1d,0 0 24px rgba(255,90,60,.6)}
#cnt{position:absolute;left:0;right:0;top:1700px;text-align:center;color:#ffd166;font-size:34px;font-weight:900}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none;place-items:center;text-align:center;color:#fff}
#ov .in{padding:0 60px}
#ov h1{margin:0;font-size:96px;line-height:1.1;color:#ffd166;text-shadow:0 6px 0 #5a0d1d,0 0 40px rgba(255,140,60,.8)}
#ov p{margin:18px 0 0;font-size:46px;font-weight:900}
#ov small{display:block;margin-top:26px;font-size:28px;color:#ffc9b0;font-weight:700;line-height:1.5}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="gl" width="1080" height="1060"></canvas>
  <div id="top"><div class="a">🎹 성실피아노 010-8756-8740</div><div class="b">리스트 초절기교 4번 「마제파」 · 마지막 30초</div></div>
  <div id="score"><img id="s2" src="media/liszt/mz-s2.png"><img id="s3" src="media/liszt/mz-s3.png"><img id="s4" src="media/liszt/mz-s4.png"><img id="s5" src="media/liszt/mz-s5.png"><div id="hl"></div><div id="cur"></div><div id="barno"></div></div>
  <div id="cap"></div>
  <div id="cnt"></div>
  <div id="ov"><div class="in" id="ovIn"></div></div>
  <div id="flash"></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var REC=/[?&]rec=1/.test(location.search),EN=/[?&]lang=(en|none)/.test(location.search),NONE=/[?&]lang=none/.test(location.search),$=function(i){return document.getElementById(i);};
var wrap=$("wrap"),stage=$("stage");
function fit(){if(REC){wrap.style.maxWidth="none";wrap.style.width="1080px";return;}stage.style.transform="scale("+(wrap.clientWidth/1080)+")";}
addEventListener("resize",fit);fit();
fetch("media/liszt/mz.json").then(function(r){return r.json();}).then(init);
function init(D){
var NOTES=D.notes,BARS=D.bars,INTRO=D.intro,END=D.end;
/* ---------- 3D ---------- */
var R=new THREE.WebGLRenderer({canvas:$("gl"),antialias:true,alpha:true,preserveDrawingBuffer:REC});R.setPixelRatio(1);R.setSize(1080,1060,false);R.setClearColor(0,0);
var scene=new THREE.Scene();scene.fog=new THREE.Fog(0x14060f,30,70);
scene.add(new THREE.AmbientLight(0xffffff,.45));var dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(-5,16,12);scene.add(dl);
var red=new THREE.PointLight(0xff5a3c,0,40);red.position.set(0,6,6);scene.add(red);
function isB(m){return [1,3,6,8,10].indexOf(m%12)>=0;}
var LO=24,HI=100,X={},nw=0;for(var m=LO;m<=HI;m++)if(!isB(m))X[m]=nw++;for(m=LO;m<=HI;m++)if(isB(m))X[m]=X[m-1]+.5;
for(m in X)X[m]-= (nw-1)/2;
var KW=1;
var kb=new THREE.Group();scene.add(kb);
var body=new THREE.Mesh(new THREE.BoxGeometry(nw+1.5,1.2,1.6),new THREE.MeshStandardMaterial({color:0x0b0b10,metalness:.6,roughness:.3}));body.position.set(0,.1,-.8);kb.add(body);
var felt=new THREE.Mesh(new THREE.BoxGeometry(nw+.3,.08,.12),new THREE.MeshBasicMaterial({color:0xc21f35}));felt.position.set(0,.06,-.06);kb.add(felt);
var KEYS={};for(m=LO;m<=HI;m++){var bk=isB(m),k=new THREE.Mesh(bk?new THREE.BoxGeometry(.56,.5,3.8):new THREE.BoxGeometry(.94,.5,6),new THREE.MeshStandardMaterial({color:bk?0x141218:0xf7f4ec,roughness:.4,emissive:0x000000}));
  k.position.set(X[m],bk?.2:-.25,bk?1.9:3);k.userData={y:k.position.y,bk:bk,glow:0};kb.add(k);KEYS[m]=k;}
var cam=new THREE.PerspectiveCamera(36,1080/1060,1,300);
/* 떨어지는 음표 막대 */
var gBar=new THREE.BoxGeometry(1,1,1),pool=[];
function bar(i){if(pool[i])return pool[i];var ms=new THREE.Mesh(gBar,new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:.55,transparent:true}));scene.add(ms);pool[i]=ms;return ms;}
var COL={R:new THREE.Color(0xffc14d),L:new THREE.Color(0xff5a3c)};
/* 불꽃 입자 */
var SP=600,spG=new THREE.BufferGeometry(),spP=new Float32Array(SP*3),spC=new Float32Array(SP*3);spG.setAttribute("position",new THREE.BufferAttribute(spP,3));spG.setAttribute("color",new THREE.BufferAttribute(spC,3));
var sparks=new THREE.Points(spG,new THREE.PointsMaterial({size:.32,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(sparks);
function rnd(i,k){var x=Math.sin(i*12.9898+k*78.233)*43758.5453;return x-Math.floor(x);}
/* 질주하는 속도선 (말발굽 바람) */
var SL=140,slG=new THREE.BufferGeometry(),slP=new Float32Array(SL*6);slG.setAttribute("position",new THREE.BufferAttribute(slP,3));
var lines=new THREE.LineSegments(slG,new THREE.LineBasicMaterial({color:0xffb08a,transparent:true,opacity:.35}));scene.add(lines);
/* 별 */
(function(){var g=new THREE.BufferGeometry(),p=[];for(var i=0;i<500;i++)p.push((rnd(i,1)-.5)*120,rnd(i,2)*50+4,-30-rnd(i,3)*30);g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffe6c8,size:.25})));})();
/* ---------- 장면 ---------- */
var LOOK=2.2,FALL=26,NP=NOTES.length;
var CAP=EN?[[0,"🌪 The calm before the storm"],[1,"👑 D major! Chords gallop like hooves"],[5,"⚡ The climax — 40+ notes per second!"],[8,"🐎 The final ride — the whole keyboard"],[11,"\u201CHe falls at last… and rises a King!\u201D"]]:[[0,"🌪 폭풍 전야 — 아래에서 위로 휘몰아쳐요"],[1,"👑 라장조로! 양손 화음이 말발굽처럼"],[5,"⚡ 기교의 클라이맥스 — 1초에 40개 넘는 음!"],[8,"🐎 마지막 질주 — 온 건반을 두드려요"],[11,"「쓰러진다… 그리고 왕으로 일어선다!」"]];
  if(NONE){$("top").innerHTML='<div class="a">🎹 Sungsil Piano</div><div class="b">Liszt · «Mazeppa»</div>';}else if(EN){$("top").innerHTML='<div class="a">🎹 Sungsil Piano · Korea</div><div class="b">Liszt · Transcendental Étude No.4 «Mazeppa» · Final 30 s</div>';}
var imgs={2:$("s2"),3:$("s3"),4:$("s4"),5:$("s5")},SC=1040/1515;
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function render(t){
  /* 소리 나는 음 / 세기 */
  var hit=0,count=0,down={};
  for(var i=0;i<NP;i++){var n=NOTES[i];if(n[0]>t+.0001)break;count++;var age=t-n[0];if(age<.12)hit+=n[4]*(1-age/.12);if(t<n[0]+Math.min(n[1],.5)+.03)down[n[2]]=n[3];}
  /* 카메라 (조금씩 다가가며, 큰 화음에 흔들림) */
  var p=Math.max(0,Math.min(1,(t-INTRO)/(END-INTRO))),shake=Math.min(1,hit/4);
  var dist=54-p*9,ang=(50-p*6)*Math.PI/180;
  cam.position.set(Math.sin(t*.4)*2+(rnd(Math.floor(t*30),5)-.5)*shake*.6,Math.sin(ang)*dist+(rnd(Math.floor(t*30),6)-.5)*shake*.5,Math.cos(ang)*dist);
  cam.lookAt(0,9.5,0);
  red.intensity=1.5*shake+.3;
  /* 떨어지는 막대 */
  var used=0;
  for(i=0;i<NP;i++){n=NOTES[i];var d=n[0]-t;if(d>LOOK)break;var e=n[0]+n[1]-t;if(e<-.05)continue;
    var ms=bar(used++),top=Math.min(LOOK,e),bot=Math.max(0,d),h=Math.max(.15,(top-bot)/LOOK*FALL);
    ms.visible=true;ms.scale.set(isB(n[2])?.5:.8,h,.5);ms.position.set(X[n[2]],.7+bot/LOOK*FALL+h/2,isB(n[2])?1.4:3.2);
    ms.material.color.copy(COL[n[3]]);ms.material.emissive.copy(COL[n[3]]);ms.material.opacity=Math.min(1,(LOOK-d)/.3);}
  for(i=used;i<pool.length;i++)pool[i].visible=false;
  /* 건반 */
  for(var mm in KEYS){var k=KEYS[mm],h2=down[mm];k.position.y=h2?k.userData.y-.15:k.userData.y;
    k.material.color.setHex(h2==="R"?0xffc14d:h2==="L"?0xff5a3c:(k.userData.bk?0x141218:0xf7f4ec));k.material.emissive.setHex(h2?(h2==="R"?0x6b4200:0x6b1200):0);}
  /* 불꽃: 최근 친 음에서 튀어 오름 */
  var si=0;for(i=0;i<NP&&si<SP;i++){n=NOTES[i];var a=t-n[0];if(a<0)break;if(a>1.1)continue;
    for(var q=0;q<4&&si<SP;q++,si++){var vx=(rnd(i,q)-.5)*6,vy=4+rnd(i,q+9)*8*(.4+n[4]),vz=(rnd(i,q+3)-.5)*3;
      spP[si*3]=X[n[2]]+vx*a;spP[si*3+1]=.8+vy*a-9*a*a;spP[si*3+2]=2.6+vz*a;var c=COL[n[3]],f=Math.max(0,1-a/1.1);spC[si*3]=c.r*f;spC[si*3+1]=c.g*f;spC[si*3+2]=c.b*f;}}
  for(;si<SP;si++){spP[si*3+1]=-99;}
  spG.attributes.position.needsUpdate=true;spG.attributes.color.needsUpdate=true;
  /* 속도선 */
  var sp=8+p*30;for(i=0;i<SL;i++){var z=-60+((rnd(i,7)*80+t*sp)%80),x=(rnd(i,8)-.5)*90,y=rnd(i,9)*30+2;
    slP[i*6]=x;slP[i*6+1]=y;slP[i*6+2]=z;slP[i*6+3]=x;slP[i*6+4]=y;slP[i*6+5]=z+2+p*5;}
  slG.attributes.position.needsUpdate=true;lines.material.opacity=.15+.4*p;
  R.render(scene,cam);
  /* 악보 */
  var bi=0;for(i=0;i<BARS.length;i++)if(t>=BARS[i].t0)bi=i;var B=BARS[bi];
  for(var s in imgs)imgs[s].classList.toggle("on",+s===B.sys);
  var im=imgs[B.sys],ih=(im.naturalHeight||400)*SC,oy=Math.max(0,(370-ih)/2);im.style.top=oy+"px";
  var f=t<B.t0?0:Math.min(1,(t-B.t0)/(B.t1-B.t0)),x=(B.x0+(B.x1-B.x0)*f)*SC;
  $("cur").style.left=(x-3)+"px";$("cur").style.top=(oy+10)+"px";$("cur").style.height=(ih-20)+"px";$("cur").style.display=t<INTRO-0.3||t>END?"none":"block";
  $("hl").style.left=(B.x0*SC)+"px";$("hl").style.width=((B.x1-B.x0)*SC)+"px";$("hl").style.top=oy+"px";$("hl").style.height=ih+"px";
  $("barno").textContent=NONE?String(B.bar):EN?"Bar "+B.bar:B.bar+"마디";
  var ci=0;for(i=0;i<CAP.length;i++)if(bi>=CAP[i][0])ci=i;$("cap").textContent=t<INTRO||NONE?"":CAP[ci][1];
  $("cnt").textContent=t<INTRO||NONE?"":EN?"🎹 Notes played: "+count:"🎹 지금까지 친 음 "+count+"개";
  $("flash").style.opacity=Math.min(.35,shake*.12);
  /* 시작·끝 화면 */
  var ov=$("ov");
  if(t<INTRO){ov.style.display="grid";ov.style.background="rgba(5,3,12,"+(t<INTRO-.6?.78:.78*(INTRO-t)/.6)+")";ov.style.opacity=t<INTRO-.6?1:(INTRO-t)/.6;
    var n3=Math.ceil(INTRO-.6-t);$("ovIn").innerHTML=NONE?'<h1>Liszt<br>«Mazeppa»</h1>'+(n3>0?'<p style="font-size:120px;color:#ff5a3c;margin-top:30px">'+n3+'</p>':''):(EN?'<p style="color:#ffc9b0">One of the hardest piano pieces ever written</p><h1>Liszt<br>«Mazeppa»</h1><p>🐎 Can you survive the final 30 seconds?</p>':'<p style="color:#ffc9b0">피아노 역사상 가장 어려운 곡 중 하나</p><h1>리스트<br>「마제파」</h1><p>🐎 마지막 30초, 버틸 수 있나요?</p>')+(n3>0?'<p style="font-size:120px;color:#ff5a3c;margin-top:30px">'+n3+'</p>':'');}
  else if(t>END){ov.style.display="grid";var o=Math.min(1,(t-END)/.8);ov.style.background="rgba(5,3,12,"+(.85*o)+")";ov.style.opacity=o;
    $("ovIn").innerHTML=NONE?'<h1 style="font-size:140px">👑</h1><p style="font-size:44px;color:#ffd166">poianopks.github.io/claude</p><small>Score: Breitkopf &amp; Härtel (public domain) · MIDI: Bernd Krueger, piano-midi.de (CC BY-SA 3.0 DE)<br>Piano: Salamander Grand Piano (CC BY 3.0) · © Sungsil Piano</small>':EN?'<h1 style="font-size:80px">👑 Did you make<br>it to the end?</h1><p>▶ Full 6-min 3D video on the channel</p><p style="font-size:38px;color:#ffd166">Free lesson · poianopks.github.io/claude</p><small>Score: Breitkopf &amp; Härtel (public domain) · MIDI: Bernd Krueger, piano-midi.de (CC BY-SA 3.0 DE)<br>Piano: Salamander Grand Piano (CC BY 3.0)<br>© Sungsil Piano · Piano technician Park Geunseong (Korea)</small>':'<h1 style="font-size:80px">👑 끝까지<br>들으셨나요?</h1><p>▶ 전곡 6분 3D 영상은 채널에서</p><p style="font-size:38px;color:#ffd166">무료 공부 교실 · poianopks.github.io/claude</p><small>악보: Breitkopf &amp; Härtel 판 (공개 저작물) · MIDI: Bernd Krueger, piano-midi.de (CC BY-SA 3.0 DE)<br>피아노 음색: Salamander Grand Piano (CC BY 3.0)<br>ⓒ 성실피아노 · 피아노조율사 박근성</small>';}
  else ov.style.display="none";
}
window.VTOTAL=D.total;window.renderVideo=render;
var ready=0,all=4;[].forEach.call(document.querySelectorAll("#score img"),function(im){if(im.complete)ready++;else im.onload=function(){ready++;if(ready>=all)go();};});
function go(){if(REC){window.READY=true;render(0);return;}
  var au=new Audio("media/liszt/mz-shorts.mp3"),pl=false;stage.addEventListener("click",function(){if(pl){au.pause();pl=false;}else{au.play();pl=true;}});
  (function loop(){render(pl?au.currentTime:INTRO+.01);requestAnimationFrame(loop);})();}
if(ready>=all)go();
}
})();
</script>
</body>
</html>
