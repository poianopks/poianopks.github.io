<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리듬 시독 훈련</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<style>
  :root{--ink:#182235;--muted:#64748b;--line:#dbe4f0;--panel:#fff;--brand:#2563eb;--brand-dark:#1d4ed8;--accent:#e11d48;--soft:#eff6ff}

  .card{padding:1.15rem;background:var(--panel);border:1px solid var(--line);border-radius:1.15rem;box-shadow:0 4px 14px #0f172a0d}.exercise-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}.exercise-head h2{margin:0;font-size:1.06rem}.exercise-head p{margin:.25rem 0 0;color:var(--muted);font-size:.8rem}.tempo{white-space:nowrap;color:var(--muted);font-size:.73rem;font-weight:800}.staff-wrap{margin:1rem 0;padding:.4rem;background:#fffdf8;border:1px solid #eadfca;border-radius:.85rem;overflow-x:auto}.staff{display:block;width:100%;min-width:590px;height:182px}.count-guide{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:1rem}.beat{padding:.45rem .55rem;background:#f8fafc;border-left:4px solid #60a5fa;border-radius:.45rem;font-size:.71rem}.beat b{display:block;color:var(--brand-dark)}.beat small{color:var(--muted)}
  .controls{display:flex;gap:.65rem}.play,.stop{min-height:3rem;border-radius:.8rem;font-weight:850}.play{flex:1;border:0;background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-dark)}.play:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-dark)}.stop{padding:0 .95rem;border:1px solid var(--line);background:#fff;color:#475569}.status{min-height:1.35rem;margin:.75rem 0 0;font-size:.8rem;font-weight:700;color:#087c62}.status.error{color:#be123c}

  @media(max-width:510px){.stage-grid{grid-template-columns:repeat(2,1fr)}.stage-card{min-height:140px}.answers{grid-template-columns:1fr}.count-guide{grid-template-columns:repeat(2,1fr)}.controls{flex-wrap:wrap}.stop{flex:1}}@media(max-width:360px){.stage-grid{grid-template-columns:1fr}}

</head>
<body>
<section id="home">
  <div class="home-inner">
    <header class="hero"><div class="hero-mark">♫</div><h1>리듬 시독 훈련</h1><p>음표와 쉼표를 보고 박을 세며 듣는 단계별 리듬 연습입니다.</p><div class="stats"><div class="stat"><b>18개</b><small>리듬 연습</small></div><div class="stat"><b>6단계</b><small>난이도</small></div><div class="stat"><b>음표+쉼표</b><small>1분~32분</small></div></div></header>
    <div class="section-label">단계별 리듬 읽기</div><div class="stage-grid" id="stageGrid"></div>
  </div>
</section>
<section id="trainer">
  <header class="topbar"><div class="topbar-in"><button class="link-btn" id="homeBtn">← 홈</button><b>리듬 시독 훈련</b><span class="level-badge" id="levelBadge"></span></div></header>
  <div class="level-banner"><b id="levelName"></b><small id="levelDescription"></small></div>
  <main class="trainer-inner">

    <article class="card">
      <div class="exercise-head"><div><h2 id="exerciseTitle"></h2><p id="exerciseDescription"></p></div><span class="tempo" id="tempo"></span></div>
      <div class="staff-wrap"><svg class="staff" id="staff" viewBox="0 0 920 182" role="img" aria-label="리듬 악보"></svg></div>
      <div class="count-guide" id="countGuide"></div>
      <div class="controls"><button class="play" id="playBtn">▶ 들어보기</button><button class="stop" id="stopBtn">■ 정지</button></div><p class="status" id="status" role="status" aria-live="polite"></p>
      <section class="answer" aria-labelledby="answerTitle"><h3 id="answerTitle"></h3><div class="answers" id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p></section>
      <div class="nav"><button id="previousBtn">← 이전</button><button class="next" id="nextBtn">다음 연습 →</button></div>
    </article>
    <p class="legend"><b>표기 안내:</b> 채운 머리는 음표, `쉼` 표기가 붙은 기호는 쉼표입니다. 재생 중 현재 기호가 분홍색으로 강조됩니다.</p>
    <article class="card complete" id="completeCard"><h2>단계 완료! 🎉</h2><p id="completeMessage"></p><button id="nextLevelBtn">다음 단계로</button></article>
  </main>
</section>
<script>
(() => {
  "use strict";
  const D={w:{name:"1분",beats:4},h:{name:"2분",beats:2},q:{name:"4분",beats:1},e:{name:"8분",beats:.5},s:{name:"16분",beats:.25},t:{name:"32분",beats:.125}};
  const n=(kind)=>({kind,rest:false}), r=(kind)=>({kind,rest:true});
  const stages=[
    {name:"1단계 · 박의 길이",description:"1분·2분음표와 쉼표의 긴 박을 느껴보세요.",exercises:[
      {title:"한 마디 유지",desc:"1분음표가 4박 전체를 채웁니다.",bpm:60,notes:[n("w")],question:"1분음표는 몇 박일까요?",answer:"4박",choices:["2박","4박","8박"]},
      {title:"소리와 정적",desc:"2분음표와 2분쉼표가 각각 2박입니다.",bpm:60,notes:[n("h"),r("h")],question:"2분쉼표는 몇 박일까요?",answer:"2박",choices:["1박","2박","4박"]},
      {title:"4박의 빈자리",desc:"1분쉼표 동안 1부터 4까지 세어 보세요.",bpm:56,notes:[r("w")],question:"1분쉼표가 끝날 때까지 세는 수는?",answer:"1-2-3-4",choices:["1-2","1-2-3-4","1-&"]}]},
    {name:"2단계 · 4분 리듬",description:"한 박짜리 음표와 쉼표를 정확히 구분합니다.",exercises:[
      {title:"걷는 박",desc:"4분음표 네 개를 일정하게 읽습니다.",bpm:68,notes:[n("q"),n("q"),n("q"),n("q")],question:"4분음표 한 개의 길이는?",answer:"1박",choices:["0.5박","1박","2박"]},
      {title:"한 박 쉬기",desc:"4분쉼표에서도 박은 계속 흘러갑니다.",bpm:68,notes:[n("q"),r("q"),n("q"),r("q")],question:"두 번째 박에 해야 할 일은?",answer:"쉰다",choices:["친다","쉰다","두 번 친다"]},
      {title:"쉼표 먼저",desc:"첫 박을 조용히 세고 다음 소리를 준비합니다.",bpm:70,notes:[r("q"),n("q"),n("q"),n("q")],question:"첫 소리는 몇 번째 박에 나오나요?",answer:"2박",choices:["1박","2박","4박"]}]},
    {name:"3단계 · 8분 리듬",description:"한 박을 둘로 나누어 ‘1 &’를 말합니다.",exercises:[
      {title:"8분음표 흐름",desc:"8분음표 여덟 개로 한 마디를 채웁니다.",bpm:72,notes:[n("e"),n("e"),n("e"),n("e"),n("e"),n("e"),n("e"),n("e")],question:"8분음표 두 개의 길이는?",answer:"1박",choices:["0.5박","1박","2박"]},
      {title:"&에서 쉬기",desc:"각 두 번째 8분 위치에서 조용히 멈춥니다.",bpm:70,notes:[n("e"),r("e"),n("e"),r("e"),n("e"),r("e"),n("e"),r("e")],question:"8분음표를 세는 방법은?",answer:"1 &",choices:["1","1 &","1 e & a"]},

    {name:"4단계 · 16분 리듬",description:"한 박을 네 조각으로 나누어 읽습니다.",exercises:[
      {title:"16분음표 한 박",desc:"‘1 e & a’를 균등하게 말해 보세요.",bpm:64,notes:[...Array(4).fill(0).map(()=>n("s")),n("q"),r("q"),n("q")],question:"16분음표 네 개의 길이는?",answer:"1박",choices:["0.5박","1박","2박"]},
      {title:"16분 쉼표 교대",desc:"소리와 쉼표가 빠르게 바뀌어도 박은 유지됩니다.",bpm:62,notes:[n("s"),r("s"),n("s"),r("s"),n("s"),r("s"),n("s"),r("s"),n("q"),n("q")],question:"16분음표를 세는 방법은?",answer:"1 e & a",choices:["1 &","1 e & a","1 ti ta te"]},
      {title:"긴 쉼 뒤 16분",desc:"2분쉼표 뒤의 짧은 소리에 집중하세요.",bpm:64,notes:[r("h"),n("s"),n("s"),n("s"),n("s"),r("q")],question:"2분쉼표의 길이는?",answer:"2박",choices:["1박","2박","4박"]}]},
    {name:"5단계 · 32분 리듬",description:"한 박을 여덟 조각으로 고르게 나눕니다.",exercises:[
      {title:"32분음표 한 박",desc:"8개의 짧은 음표를 같은 간격으로 연주합니다.",bpm:52,notes:[...Array(8).fill(0).map(()=>n("t")),n("q"),r("q"),n("q")],question:"32분음표 여덟 개의 길이는?",answer:"1박",choices:["0.5박","1박","2박"]},
      {title:"32분 쉼표 섞기",desc:"짧은 쉼표도 음표와 같은 시간 자리를 차지합니다.",bpm:50,notes:[n("t"),r("t"),n("t"),r("t"),n("t"),r("t"),n("t"),r("t"),n("e"),r("e"),n("q"),r("q")],question:"32분음표는 한 박을 몇 조각으로 나누나요?",answer:"8조각",choices:["2조각","4조각","8조각"]},
      {title:"쉼 뒤의 질주",desc:"8분쉼표 뒤에 32분 리듬이 이어집니다.",bpm:52,notes:[r("e"),...Array(8).fill(0).map(()=>n("t")),n("h"),n("e")],question:"첫 기호는 무엇인가요?",answer:"8분쉼표",choices:["8분음표","8분쉼표","16분쉼표"]}]},
    {name:"6단계 · 종합 리듬",description:"모든 길이의 음표와 쉼표를 한 흐름으로 읽습니다.",exercises:[
      {title:"모든 길이의 조합",desc:"4분·8분·16분·32분 리듬을 차례로 읽습니다.",bpm:60,notes:[n("q"),r("e"),n("e"),n("s"),r("s"),n("s"),r("s"),...Array(8).fill(0).map((_,i)=>i%2?n("t"):r("t"))],question:"마지막 8개 기호의 길이는?",answer:"32분",choices:["8분","16분","32분"]},
      {title:"긴 쉼, 짧은 소리",desc:"2분쉼표 뒤에 16분과 32분 리듬을 연결합니다.",bpm:58,notes:[r("h"),n("s"),r("s"),n("s"),r("s"),n("t"),r("t"),n("t"),r("t"),n("t"),r("t"),n("t"),r("t")],question:"첫 쉼표의 길이는?",answer:"2박",choices:["1박","2박","4박"]},
      {title:"마무리 종합",desc:"1분음표와 1분쉼표를 포함한 두 마디 읽기입니다.",bpm:54,notes:[n("w"),r("w")],bars:2,question:"각 마디의 길이는?",answer:"4박",choices:["2박","3박","4박"]}]}
  ];
  const PITCHES=["C4","E4","G4","D5","G4","E4","F4","A4"];
  const $=id=>document.getElementById(id);let stageIndex=0,exerciseIndex=0,completed=new Set(),playing=false,synth=null,timers=[];
  function symbol(item,x,y,active){const c=active?"#e11d48":"#182235",kind=item.kind;if(item.rest){const paths={w:`<rect x="${x-16}" y="${y-29}" width="32" height="8" fill="${c}"/>`,h:`<rect x="${x-16}" y="${y-20}" width="32" height="8" fill="${c}"/>`,q:`<path d="M${x} ${y-40}l10 12-12 12 10 12-12 12" fill="none" stroke="${c}" stroke-width="4"/>`,e:`<path d="M${x-4} ${y-42}q16 13 0 29q13 9 0 25" fill="none" stroke="${c}" stroke-width="4"/>`,s:`<path d="M${x-8} ${y-44}q18 9 2 21q18 9 1 22q14 7 1 18" fill="none" stroke="${c}" stroke-width="3.5"/>`,t:`<path d="M${x-10} ${y-45}q20 8 3 18q18 8 2 18q16 8 1 18q12 7 0 15" fill="none" stroke="${c}" stroke-width="3"/>`};return `<g>${paths[kind]}<text x="${x}" y="${y+45}" text-anchor="middle" fill="#64748b" font-size="11">${D[kind].name}쉼</text></g>`}const head=kind==="w"||kind==="h"?`<ellipse cx="${x}" cy="${y}" rx="12" ry="7" fill="#fffdf8" stroke="${c}" stroke-width="3"/>`:`<ellipse cx="${x}" cy="${y}" rx="12" ry="7" fill="${c}" transform="rotate(-18 ${x} ${y})"/>`;if(kind==="w")return `<g>${head}<text x="${x}" y="${y+45}" text-anchor="middle" fill="#64748b" font-size="11">${D[kind].name}</text></g>`;const flags=kind==="e"?1:kind==="s"?2:kind==="t"?3:0;return `<g>${head}<path d="M${x+10} ${y}V${y-54}" stroke="${c}" stroke-width="3"/>${Array.from({length:flags},(_,i)=>`<path d="M${x+10} ${y-54+i*9}q15 7 20 19" fill="none" stroke="${c}" stroke-width="3"/>`).join("")}<text x="${x}" y="${y+45}" text-anchor="middle" fill="#64748b" font-size="11">${D[kind].name}</text></g>`}
  function current(){return stages[stageIndex].exercises[exerciseIndex]}function totalBeats(items){return items.reduce((a,item)=>a+D[item.kind].beats,0)}
  function render(active=-1){const s=stages[stageIndex],ex=current(),beats=totalBeats(ex.notes),bars=ex.bars||1,perBar=beats/bars;if(!Number.isInteger(perBar)||perBar!==4){$("status").textContent="리듬 데이터 오류: 각 마디는 4박이어야 합니다.";$("status").className="status error";return} $("levelBadge").textContent=`${stageIndex+1}단계`;$("levelName").textContent=s.name;$("levelDescription").textContent=s.description;$("exerciseTitle").textContent=ex.title;$("exerciseDescription").textContent=ex.desc;$("tempo").textContent=`BPM ${ex.bpm}`;$("progressLabel").textContent=`문제 ${exerciseIndex+1} / ${s.exercises.length}`;$("completeLabel").textContent=`완료 ${completed.size} / ${s.exercises.length}`;$("progressBar").style.width=`${(exerciseIndex+1)/s.exercises.length*100}%`;
    const width=800,start=85;let beat=0;const lines=[48,64,80,96,112].map(y=>`<line x1="30" y1="${y}" x2="885" y2="${y}" stroke="#94a3b8"/>`).join("");const barsSvg=Array.from({length:bars+1},(_,i)=>`<line x1="${start+width*i/bars}" y1="42" x2="${start+width*i/bars}" y2="120" stroke="#334155" stroke-width="${i===0||i===bars?3:1.5}"/>`).join("");const notes=ex.notes.map((item,i)=>{const duration=D[item.kind].beats,x=start+(beat+duration/2)*width/beats;beat+=duration;return `<g data-index="${i}">${symbol(item,x,80,i===active)}</g>`}).join("");$("staff").innerHTML=`<title>${ex.title}</title>${lines}${barsSvg}<text x="38" y="38" font-size="18" font-weight="800">4/4</text>${notes}`;const guide=[];for(let b=0;b<beats;b+=1){let p=0,content=[];for(const item of ex.notes){const startBeat=p,endBeat=p+D[item.kind].beats;if(endBeat>b&&startBeat<b+1)content.push(item.rest?`${D[item.kind].name}쉼`:`${D[item.kind].name}음`);p=endBeat}guide.push(`<div class="beat"><b>${b%4+1}박</b><small>${content.join(" · ")}</small></div>`)}$("countGuide").innerHTML=guide.slice(0,4).join("");
    $("answerTitle").textContent=ex.question;const opts=[...ex.choices].sort((a,b)=>a.localeCompare(b,"ko"));$("answers").innerHTML=opts.map(x=>`<button class="answer-btn" data-answer="${x}">${x}</button>`).join("");document.querySelectorAll(".answer-btn").forEach(btn=>btn.addEventListener("click",()=>answer(btn,ex.answer)));$("feedback").textContent="";$("previousBtn").disabled=exerciseIndex===0;$("nextBtn").textContent=exerciseIndex===s.exercises.length-1?"단계 확인 →":"다음 연습 →";$("completeCard").style.display=completed.size===s.exercises.length?"block":"none";$("completeMessage").textContent=stageIndex<stages.length-1?"다음 단계에서 더 짧고 다양한 쉼표를 연습해 보세요.":"모든 리듬 단계를 완료했습니다!"}
  function answer(button,correct){document.querySelectorAll(".answer-btn").forEach(x=>x.disabled=true);if(button.dataset.answer===correct){button.classList.add("correct");completed.add(exerciseIndex);$("feedback").textContent="정답입니다! 박을 소리 내어 다시 세어 보세요.";if(completed.size===stages[stageIndex].exercises.length)$("completeCard").style.display="block"}else{button.classList.add("wrong");document.querySelector(`[data-answer="${correct}"]`).classList.add("correct");$("feedback").textContent=`정답은 ${correct}입니다. 악보를 다시 보고 박을 세어 보세요.`}}
  function stop(){timers.forEach(clearTimeout);timers=[];if(synth){try{synth.triggerRelease()}catch(_){}}playing=false;render();$("playBtn").textContent="▶ 들어보기";$("status").textContent="정지했습니다."; $("status").className="status"}
  async function play(){stop();try{if(!window.Tone)throw Error("피아노 음원을 준비하지 못했습니다. 인터넷 연결을 확인해 주세요.");await Tone.start();if(!synth)synth=new Tone.Synth({oscillator:{type:"triangle"},envelope:{attack:.02,decay:.1,sustain:.6,release:.5}}).toDestination();const ex=current(),spb=60/ex.bpm;let elapsed=0,sounded=0;playing=true;$("playBtn").textContent="■ 재생 중";$("status").textContent="재생 중: 음표는 피아노 음으로, 쉼표는 무음으로 진행합니다.";ex.notes.forEach((item,i)=>{const duration=D[item.kind].beats*spb;timers.push(setTimeout(()=>{if(!playing)return;render(i);if(!item.rest){try{synth.triggerAttackRelease(PITCHES[sounded%PITCHES.length],duration*.9);sounded++}catch(error){$("status").textContent=`오디오 오류: ${error.message}`;$("status").className="status error"}}},elapsed*1000));elapsed+=duration});timers.push(setTimeout(()=>{if(playing){playing=false;render();$("playBtn").textContent="▶ 들어보기";$("status").textContent="재생이 끝났습니다. 다음 연습으로 넘어가 보세요."}},elapsed*1000+120))}catch(error){$("status").textContent=`오디오 오류: ${error.message}`;$("status").className="status error"}}
  function showTrainer(index){stop();stageIndex=index;exerciseIndex=0;completed=new Set();$("home").style.display="none";$("trainer").style.display="block";render()}function next(){stop();if(exerciseIndex<stages[stageIndex].exercises.length-1){exerciseIndex++;render()}else if(stageIndex<stages.length-1)showTrainer(stageIndex+1)}function previous(){if(exerciseIndex>0){stop();exerciseIndex--;render()}}
  $("stageGrid").innerHTML=stages.map((s,i)=>`<button class="stage-card" data-stage="${i}"><div class="stage-num">${i+1}</div><h2>${s.name}</h2><p>${s.description}</p><span>연습 ${s.exercises.length}개</span></button>`).join("");document.querySelectorAll("[data-stage]").forEach(btn=>btn.addEventListener("click",()=>showTrainer(Number(btn.dataset.stage))));$("homeBtn").addEventListener("click",()=>{stop();$("trainer").style.display="none";$("home").style.display="block"});$("playBtn").addEventListener("click",play);$("stopBtn").addEventListener("click",stop);$("nextBtn").addEventListener("click",next);$("previousBtn").addEventListener("click",previous);$("nextLevelBtn").addEventListener("click",()=>stageIndex<stages.length-1&&showTrainer(stageIndex+1));
})();
</script>
