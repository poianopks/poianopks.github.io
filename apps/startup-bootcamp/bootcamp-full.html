<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이브 코딩 부트캠프 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;--fg:#1e2230;--card:#fff;--border:#e8e2d8;
  --primary:#4f46e5;--primary-fg:#fff;
  --muted:#f5f3ee;--muted-fg:#6b7280;
  --accent:#f59e0b;--green:#16a34a;--red:#e11d48;
  --radius:14px;--shadow:0 2px 8px rgba(0,0,0,.07);
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;line-height:1.7}
a{color:inherit;text-decoration:none;cursor:pointer}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(250,249,246,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 20px;gap:20px}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--primary);font-size:1rem}
.nav-brand-icon{width:34px;height:34px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem}
.nav-links{margin-left:auto;display:flex;gap:4px}
.nav-link{padding:6px 12px;border-radius:8px;font-size:.85rem;font-weight:500;color:var(--muted-fg);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.nav-link:hover,.nav-link.active{background:rgba(79,70,229,.1);color:var(--primary)}
.nav-link-icon{font-size:1rem}

/* CONTAINER */
.container{max-width:860px;margin:0 auto;padding:32px 16px 80px}

/* HOME HERO */
.hero{background:linear-gradient(135deg,#eef0ff 0%,#e8e2ff 100%);border-radius:24px;padding:40px 36px;margin-bottom:32px;position:relative;overflow:hidden}
.hero::after{content:'✦';position:absolute;right:24px;top:16px;font-size:5rem;color:rgba(79,70,229,.08);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(79,70,229,.12);color:var(--primary);border-radius:100px;padding:4px 14px;font-size:.8rem;font-weight:600;margin-bottom:16px}
.hero h1{font-size:2rem;font-weight:800;line-height:1.25;margin-bottom:12px}
.hero p{color:#555;font-size:.95rem;margin-bottom:24px}
.progress-card{background:#fff;border-radius:16px;padding:20px 24px}
.progress-label{font-size:.8rem;color:var(--muted-fg);font-weight:500;margin-bottom:6px}
.progress-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.progress-pct{font-size:1.6rem;font-weight:800;color:var(--primary)}
.progress-count{font-size:.85rem;color:var(--muted-fg)}
.progress-bar-bg{height:8px;background:#e8e2d8;border-radius:100px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--primary);border-radius:100px;transition:width .4s ease}

/* WEEK CARDS */
.section-title{font-size:1.2rem;font-weight:700;margin-bottom:16px}
.week-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:all .15s;box-shadow:var(--shadow)}
.week-card:hover{border-color:var(--primary);box-shadow:0 4px 16px rgba(79,70,229,.12)}
.week-num{width:40px;height:40px;background:rgba(79,70,229,.1);color:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0}
.week-info{flex:1}
.week-info h3{font-size:.95rem;font-weight:700;margin-bottom:3px}
.week-info p{font-size:.8rem;color:var(--muted-fg);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.week-meta{font-size:.8rem;color:var(--muted-fg);display:flex;align-items:center;gap:4px;flex-shrink:0}
.week-arrow{color:var(--muted-fg);font-size:1.1rem}

/* WEEK DETAIL */
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;color:var(--muted-fg);margin-bottom:20px;cursor:pointer}
.back-link:hover{color:var(--fg)}
.week-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:24px;box-shadow:var(--shadow)}
.week-header h1{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.week-header p{color:var(--muted-fg);font-size:.9rem}
.lesson-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;box-shadow:var(--shadow)}
.lesson-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(79,70,229,.1)}
.lesson-num{width:32px;height:32px;background:var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:var(--primary);flex-shrink:0}
.lesson-num.done{background:rgba(22,163,74,.1);color:var(--green)}
.lesson-title{flex:1;font-size:.9rem;font-weight:600}
.lesson-icon{color:var(--muted-fg);font-size:1.2rem}
.lesson-icon.done{color:var(--green)}

/* LESSON DETAIL */
.lesson-title-main{font-size:1.8rem;font-weight:800;line-height:1.3;margin-bottom:12px}
.done-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(22,163,74,.1);color:var(--green);border-radius:100px;padding:4px 12px;font-size:.8rem;font-weight:600;margin-bottom:20px}
.content-body{font-size:1rem;line-height:1.8;color:var(--fg);margin-bottom:24px}
.content-body p{margin-bottom:16px}
.callout{background:rgba(79,70,229,.05);border-left:4px solid var(--accent);border-radius:0 16px 16px 0;padding:20px 24px;margin:24px 0;position:relative}
.callout-label{font-weight:700;color:#92400e;font-size:.85rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.callout p{margin:0;font-size:.95rem}

/* CODE BLOCK */
.code-block{border-radius:14px;overflow:hidden;border:1px solid #334155;box-shadow:0 4px 16px rgba(0,0,0,.15);margin:20px 0}
.code-header{background:#1e293b;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.code-dots{display:flex;gap:6px}
.code-dot{width:12px;height:12px;border-radius:50%}
.code-dot.r{background:#ef4444}.code-dot.y{background:#f59e0b}.code-dot.g{background:#22c55e}
.code-lang{font-size:.7rem;font-family:monospace;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;margin-left:8px}
.copy-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;background:#334155;border:none;border-radius:8px;color:#cbd5e1;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
.copy-btn:hover{background:#475569;color:#fff}
.copy-btn.copied{background:rgba(34,197,94,.2);color:#4ade80}
pre{background:#0f172a;color:#e2e8f0;padding:20px;overflow-x:auto;font-size:.82rem;line-height:1.7;font-family:Menlo,Monaco,'Courier New',monospace;margin:0}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.card-title{font-size:1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title-icon{font-size:1.2rem}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.term-item{background:var(--muted);border-radius:10px;padding:14px}
.term-name{font-weight:700;color:var(--primary);font-size:.85rem;margin-bottom:4px}
.term-def{font-size:.8rem;color:var(--muted-fg);line-height:1.5}
.summary-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.summary-item{display:flex;gap:10px;font-size:.9rem}
.summary-num{width:24px;height:24px;background:rgba(79,70,229,.15);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;margin-top:2px}
.ai-tip-card{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius);padding:24px;margin-bottom:20px}
.ai-tip-card .card-title{color:#92400e}
.ai-tip-card p{color:#78350f;font-size:.9rem}
.practice-card{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius);padding:24px;margin-bottom:20px}
.practice-card .card-title{color:#14532d}
.practice-card p{color:#166534;font-size:.9rem}

/* COMPLETE BTN */
.complete-wrap{padding:24px 0;display:flex;justify-content:center}
.complete-btn{padding:14px 40px;font-size:1rem;font-weight:700;border-radius:100px;border:none;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;min-width:200px}
.complete-btn.default{background:var(--primary);color:#fff}
.complete-btn.default:hover{background:#4338ca;transform:translateY(-1px)}
.complete-btn.done{background:#fff;border:2px solid var(--green);color:var(--green)}
.celebrate{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:800;color:var(--primary);pointer-events:none;z-index:100;animation:popfade 1.5s forwards}
@keyframes popfade{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(250,249,246,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:10px 16px;z-index:40}
.bottom-nav-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-lesson-btn{flex:1;display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:all .15s;border:none;background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:.82rem}
.nav-lesson-btn:hover{background:var(--muted)}
.nav-lesson-btn.prev{color:var(--muted-fg);justify-content:flex-start}
.nav-lesson-btn.next{color:var(--primary);justify-content:flex-end;font-weight:600}
.nav-lesson-btn .nav-lesson-title{display:flex;flex-direction:column;text-align:left}
.nav-lesson-btn.next .nav-lesson-title{text-align:right}
.nav-lesson-small{font-size:.72rem;color:var(--muted-fg)}
.nav-divider{width:1px;height:36px;background:var(--border);flex-shrink:0}

/* GLOSSARY */
.search-wrap{position:relative;margin-bottom:24px}
.search-input{width:100%;padding:12px 16px 12px 44px;border:1px solid var(--border);border-radius:12px;font-size:.95rem;font-family:'Noto Sans KR',sans-serif;background:var(--card);color:var(--fg);outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1.1rem;color:var(--muted-fg)}
.glossary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.glossary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.glossary-term{font-weight:700;color:var(--primary);font-size:.9rem;margin-bottom:8px}
.glossary-def{font-size:.82rem;color:var(--muted-fg);line-height:1.6}
.no-results{text-align:center;color:var(--muted-fg);padding:40px;font-size:.9rem}

/* ROADMAP */
.roadmap-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.roadmap-scroll::-webkit-scrollbar{display:none}
.roadmap-day{flex-shrink:0;width:200px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.roadmap-day-num{font-size:.75rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.roadmap-day-title{font-size:.9rem;font-weight:700;margin-bottom:6px}
.roadmap-day-desc{font-size:.78rem;color:var(--muted-fg);line-height:1.5}

/* FOOTER */
.footer{border-top:1px solid var(--border);padding:24px 16px;text-align:center;font-size:.8rem;color:var(--muted-fg);margin-top:40px}

/* UTIL */
.bold-text{font-weight:700}
@media(max-width:600px){
  .hero h1{font-size:1.5rem}
  .hero{padding:28px 20px}
  .nav-brand span{display:none}
  .week-info p{display:none}
  .lesson-title-main{font-size:1.4rem}
  .term-grid{grid-template-columns:1fr}
  .glossary-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-brand" onclick="navigate('home')">
    <div class="nav-brand-icon">📚</div>
    <span>바이브 코딩 부트캠프 학습</span>
  </div>
  <div class="nav-links">
    <div class="nav-link" id="nav-home" onclick="navigate('home')"><span class="nav-link-icon">🏠</span> 홈</div>
    <div class="nav-link" id="nav-vibe" onclick="navigate('week','vibe-az')"><span class="nav-link-icon">⚡</span> 바이브 코딩 특강</div>
    <div class="nav-link" id="nav-glossary" onclick="navigate('glossary')"><span class="nav-link-icon">📖</span> 용어 사전</div>
  </div>
</nav>

<!-- MAIN -->
<div id="app"></div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const glossary = [
  {id:"html",term:"HTML",def:"웹 페이지의 뼈대를 만드는 언어입니다. 제목, 문단, 이미지 같은 요소들을 어디에 배치할지 결정합니다."},
  {id:"css",term:"CSS",def:"웹 페이지를 꾸며주는 언어입니다. 글자 색상, 크기, 배경색 등 디자인을 입히는 역할을 합니다."},
  {id:"javascript",term:"JavaScript",def:"웹 페이지가 살아서 움직이게 만드는 언어입니다. 버튼을 클릭했을 때 어떤 일이 일어날지 결정합니다."},
  {id:"deploy",term:"배포 (Deploy)",def:"내 컴퓨터에만 있던 웹사이트를 인터넷에 올려서 다른 사람들도 볼 수 있게 만드는 과정입니다."},
  {id:"api",term:"API",def:"프로그램들이 서로 대화할 수 있게 해주는 창구입니다. 식당의 점원처럼 우리의 요청을 주방(서버)에 전달하고 결과를 가져옵니다."},
  {id:"github",term:"GitHub",def:"프로그래머들의 소스 코드를 저장하고 공유하는 클라우드 서비스입니다. 코드의 변경 기록도 모두 남습니다."},
  {id:"cloudflare-pages",term:"Cloudflare Pages",def:"우리가 만든 웹사이트를 전 세계에 빠르고 무료로 배포할 수 있게 도와주는 서비스입니다."},
  {id:"formspree",term:"Formspree",def:"웹사이트에서 방문자가 남긴 문의나 연락처를 내 이메일로 곧바로 전달해주는 편리한 서비스입니다."},
  {id:"teachable-machine",term:"Teachable Machine",def:"코딩을 몰라도 이미지를 학습시켜서 나만의 인공지능 모델을 쉽게 만들 수 있는 구글의 도구입니다."},
  {id:"google-adsense",term:"Google AdSense",def:"내 웹사이트나 블로그에 구글의 광고를 달아서 사람들이 클릭할 때마다 돈을 벌 수 있게 해주는 서비스입니다."},
  {id:"google-analytics",term:"Google Analytics (GA4)",def:"내 웹사이트에 몇 명이 방문했는지, 어디서 왔는지 분석해주는 구글의 무료 도구입니다."},
  {id:"microsoft-clarity",term:"Microsoft Clarity",def:"방문자들이 웹사이트에서 마우스를 어떻게 움직이고 어디를 클릭했는지 영상과 지도로 보여주는 도구입니다."},
  {id:"heatmap",term:"히트맵",def:"웹사이트에서 사람들이 가장 많이 클릭하고 머문 곳을 붉은색으로, 안 본 곳을 푸른색으로 보여주는 온도 지도입니다."},
  {id:"aarrr",term:"AARRR 퍼널",def:"스타트업이 성장하기 위해 사용자를 분석하는 5단계(획득, 활성화, 유지, 수익, 추천) 방법론입니다."},
  {id:"pmf",term:"PMF (Product-Market Fit)",def:"내가 만든 제품을 사람들이 정말로 원하고 사랑하는 상태를 말합니다. 사업 성공의 핵심입니다."},
  {id:"seo",term:"SEO (검색엔진 최적화)",def:"구글이나 네이버에서 사람들이 검색했을 때 내 웹사이트가 가장 위에 나오도록 웹사이트를 다듬는 작업입니다."},
  {id:"geo",term:"GEO",def:"최근 떠오르는 개념으로, 인공지능 검색 엔진이 답변할 때 내 웹사이트가 추천되도록 최적화하는 작업입니다."},
  {id:"viral-marketing",term:"바이럴 마케팅",def:"사람들이 자발적으로 내 제품을 친구들에게 소문내고 공유하게 만드는 마케팅 방법입니다."},
  {id:"react",term:"React",def:"페이스북이 만든 도구로, 웹사이트를 레고 블록처럼 부품(컴포넌트)을 조립해서 만들 수 있게 해줍니다."},
  {id:"component",term:"컴포넌트",def:"웹사이트를 구성하는 부품입니다. '버튼', '헤더' 등을 한 번 만들어두고 여러 번 재사용할 수 있습니다."},
  {id:"jsx",term:"JSX",def:"JavaScript 안에서 HTML을 쉽게 작성할 수 있게 해주는 문법입니다."},
  {id:"vite",term:"Vite",def:"웹 개발을 시작할 때 필요한 환경을 아주 빠르게 만들어주는 도구입니다."},
  {id:"serverless",term:"서버리스 (Serverless)",def:"서버가 없는 게 아니라, 서버 관리를 내가 할 필요 없이 빌려 쓰는 방식입니다. 쓴 만큼만 돈을 냅니다."},
  {id:"cloudflare-workers",term:"Cloudflare Workers",def:"서버를 직접 만들지 않고도 전 세계에 퍼져 있는 서버에서 내 코드를 실행시켜주는 서비스입니다."},
  {id:"openai-api",term:"OpenAI API",def:"ChatGPT의 두뇌를 내 웹사이트나 앱에서 사용할 수 있게 해주는 연결 통로입니다."},
  {id:"prompt-engineering",term:"프롬프트 엔지니어링",def:"인공지능에게 똑똑하게 질문해서 내가 원하는 답변을 정확히 얻어내는 기술입니다."},
  {id:"polar",term:"Polar",def:"해외 사용자들에게 돈을 받을 때 세금이나 환율 등 복잡한 문제를 알아서 해결해주는 결제 서비스입니다."},
  {id:"mor",term:"MOR (Merchant of Record)",def:"내 대신 물건을 팔아주고 전 세계의 복잡한 세금 처리를 모두 대행해주는 회사입니다."},

    {id:"w1-3",title:"첫 번째 프로젝트 — 로또 번호 추첨기",
     content:"쉽게 말하면 이거야:\n가장 간단한 프로젝트부터 시작해보는 거예요! 로또 추첨기는 간단하지만 웹 개발의 중요한 모든 기능이 다 들어가 있습니다.\n\n왜 하필 로또 추첨기일까요? 무작위(랜덤)로 숫자를 뽑고, 버튼을 클릭하는 JavaScript의 핵심을 모두 담고 있기 때문입니다. 아래 코드를 index.html로 저장하고 브라우저로 열어보세요!\n\n```html\n<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>로또 번호 추첨기</title>\n  <style>\n    body { background: #1a1a2e; color: white; font-family: sans-serif;\n           display: flex; flex-direction: column; align-items: center;\n           justify-content: center; min-height: 100vh; margin: 0; }\n    h1   { font-size: 2rem; margin-bottom: 24px; }\n    #balls { display: flex; gap: 12px; margin-bottom: 32px; }\n    .ball  { width: 56px; height: 56px; border-radius: 50%;\n             background: #4f46e5; display: flex; align-items: center;\n             justify-content: center; font-size: 1.4rem; font-weight: bold; }\n    button { padding: 14px 36px; font-size: 1.1rem; background: #e11d48;\n             color: white; border: none; border-radius: 12px; cursor: pointer; }\n  </style>\n</head>\n<body>\n  <h1>🎰 로또 번호 추첨기</h1>\n  <div id=\"balls\">\n    <div class=\"ball\">?</div><div class=\"ball\">?</div>\n    <div class=\"ball\">?</div><div class=\"ball\">?</div>\n    <div class=\"ball\">?</div><div class=\"ball\">?</div>\n  </div>\n  <button onclick=\"draw()\">번호 뽑기!</button>\n  <script>\n    function draw() {\n      const nums = [];\n      while (nums.length < 6) {\n        const n = Math.floor(Math.random() * 45) + 1;\n        if (!nums.includes(n)) nums.push(n);\n      }\n      nums.sort((a, b) => a - b);\n      document.querySelectorAll('.ball')\n        .forEach((el, i) => el.textContent = nums[i]);\n    }\n  <\/script>\n<\/body>\n<\/html>\n```\n\nAI에게 '버튼 더 크게', '배경 어두운 모드로'라고 계속 시키면서 원하는 대로 바꿔보세요. 이것이 바이브 코딩의 기본 사이클입니다.",
     aiTip:"ChatGPT에게 '로또 번호 추첨기 HTML/CSS/JS 코드 만들어줘'라고 해보세요.",
     practice:"위 코드를 index.html로 저장하고 브라우저로 열어서 버튼을 눌러보세요!",
     summary:["로또 추첨기 = JS의 핵심인 '랜덤'과 '버튼 클릭' 연습","AI에게 시키고 → 코드 복사 → 저장 → 확인이 바이브 코딩 사이클","마음에 안 들면 계속 AI에게 수정 요청"],
     terms:["javascript","vibe-coding","chatgpt"]},
    {id:"w1-4",title:"Cloudflare Pages로 배포하기",
     content:"쉽게 말하면 이거야:\n내 컴퓨터에만 있던 웹사이트 파일을 24시간 켜져 있는 엄청나게 큰 컴퓨터(서버)로 옮기는 과정이에요.\n\n이것을 '배포(Deploy)'라고 부릅니다. 코드를 GitHub라는 곳에 올린 뒤 Cloudflare Pages에 연결하고 '배포' 버튼만 누르면 됩니다. 그러면 https://나의사이트.pages.dev라는 전 세계 누구나 들어올 수 있는 주소가 생깁니다.",
     aiTip:"ChatGPT에게 'GitHub에 파일 올리는 방법을 초보에게 설명해줘'라고 물어보세요.",
     practice:"GitHub.com에 계정을 만들어보세요. (무료)",
     summary:["배포 = 내 웹사이트를 전 세계에 공개하는 것","GitHub에 코드 저장 → Cloudflare Pages가 자동 배포","무료로 나만의 인터넷 주소(URL) 생성 가능"],
     terms:["deploy","github","cloudflare-pages"]},
    {id:"w1-5",title:"외부 서비스 연결하기 — 레고 조립하듯",
     content:"쉽게 말하면 이거야:\n모든 기능을 내가 일일이 직접 만들 필요가 없습니다. 남들이 만들어둔 훌륭한 레고 블록을 내 웹사이트에 끼워 넣기만 하면 돼요.\n\nFormspree를 사용하면 방문자가 남긴 글을 내 이메일로 바로 받을 수 있고, Disqus로 댓글 기능을 붙일 수 있으며, Teachable Machine으로 AI 기능을 연결할 수도 있습니다. 이렇게 프로그램끼리 서로 대화할 수 있게 이어주는 부품을 API라고 부릅니다.",
     aiTip:"ChatGPT에게 'Formspree를 내 HTML 웹사이트에 붙이는 방법 알려줘'라고 물어보세요.",
     practice:"Formspree.io에 접속해서 무료 계정을 만들어보세요.",
     summary:["직접 만들기 어려운 기능은 남이 만든 서비스를 빌려 쓴다","API는 프로그램들이 서로 대화하는 창구","Formspree(폼), Disqus(댓글), Teachable Machine(AI) — 모두 무료"],
     terms:["api","formspree","teachable-machine"]},
    {id:"w1-6",title:"구글 애드센스로 수익내기",
     content:"쉽게 말하면 이거야:\n도로에 사람이 많이 지나다니면 광고판의 가치가 올라가죠? 웹사이트도 방문자(트래픽)가 많아지면 돈이 됩니다.\n\n구글 애드센스는 내 웹사이트에 코드를 한 줄 복사해서 붙여넣기만 하면 알아서 사용자에게 맞는 광고를 보여줍니다. 방문자가 늘고 그 광고를 클릭하면 내 통장으로 수익이 들어오죠!",
     aiTip:"ChatGPT에게 '구글 애드센스 승인받는 방법 알려줘'라고 물어보세요.",
     practice:"내 사이트에 어떤 주제의 콘텐츠를 올리면 방문자가 올지 3가지 아이디어를 적어보세요.",
     summary:["방문자(트래픽) 많을수록 광고 수익 증가","구글 애드센스 코드 한 줄로 광고 자동 게재","수익화의 첫걸음 — 나중에 구독 모델로 발전 가능"],
     terms:["google-adsense"]}
  ]},
  {id:"week2",title:"2주차: 데이터로 성장하기",desc:"사람들이 내 제품을 어떻게 쓰는지 데이터로 보고, 더 좋은 제품으로 성장시키는 법을 배웁니다.",emoji:"2",lessons:[
    {id:"w2-1",title:"Google Analytics & Clarity 설치하기",
     content:"쉽게 말하면 이거야:\n온라인 가게에 CCTV를 달아 손님들이 어떤 물건을 보고 어디서 발길을 돌리는지 분석하는 겁니다.\n\nGoogle Analytics(GA4)를 쓰면 몇 명이 우리 사이트에 왔는지, 어디서 들어왔는지 파악할 수 있습니다. Microsoft Clarity는 '히트맵'과 '세션 녹화' 기능까지 제공해서, 화면의 어디를 클릭하고 어디까지 스크롤을 내렸는지 영상처럼 보여줍니다. 둘 다 무료이고, 코드 한 줄만 복사해서 붙이면 끝입니다.",
     aiTip:"ChatGPT에 'Google Analytics GA4 설치 방법 HTML 웹사이트에'라고 물어보세요.",
     practice:"analytics.google.com에 접속해서 무료 계정 만들기.",
     summary:["Google Analytics로 방문자 수/출처 분석","Microsoft Clarity로 클릭 위치와 스크롤 패턴 확인","둘 다 무료 — 코드 한 줄로 설치 완료"],
     terms:["google-analytics","microsoft-clarity","heatmap"]},
    {id:"w2-2",title:"AARRR 퍼널 — 사용자를 분석하는 5단계",
     content:"쉽게 말하면 이거야:\n깔때기(퍼널)의 어느 구멍으로 물이 제일 많이 새어나가는지 찾아서 고치는 과정입니다.\n\n이 5단계는 '해적 지표'라고도 불립니다. Acquisition(획득) = 어떻게 알게 됐나? Activation(활성화) = 처음 써봤나? Retention(유지) = 다시 오나? Revenue(수익) = 돈 냈나? Referral(추천) = 친구한테 알렸나? 어느 단계에서 사람들이 대거 이탈하는지를 찾는 것이 서비스 성장의 첫걸음입니다.",
     aiTip:"ChatGPT에게 '인스타그램의 AARRR 퍼널을 분석해줘'라고 물어보세요.",
     practice:"내가 자주 쓰는 앱 하나를 골라 AARRR 5단계를 직접 분석해보세요.",
     summary:["AARRR = 획득 → 활성화 → 유지 → 수익 → 추천","어느 단계에서 이탈하는지 찾는 것이 핵심","데이터 없이 성장할 수 없다"],
     terms:["aarrr"]},
    {id:"w2-3",title:"PMF와 아하 모먼트",
     content:"쉽게 말하면 이거야:\n내 제품이 시장에 딱 맞는 상태(PMF)를 찾고, 사용자가 '우와, 이거 대박이다!'라고 느끼는 순간(아하 모먼트)을 만들어야 합니다.\n\nPMF(Product-Market Fit)는 배고픈 사람에게 밥을 주는 것처럼 시장이 간절히 원하는 상태를 말합니다. 아하 모먼트(Aha Moment)는 사용자가 처음으로 그 가치를 깨닫는 찰나입니다. 인스타그램의 경우 '첫 좋아요를 받았을 때'가 바로 아하 모먼트였죠.",
     aiTip:"ChatGPT에게 '유명 스타트업들의 PMF 달성 스토리 3가지 알려줘'라고 물어보세요.",
     practice:"내가 매일 또는 매주 반드시 쓰는 앱은? 그 앱의 '아하 모먼트'가 언제였는지 생각해보세요.",
     summary:["PMF = 내 제품을 시장이 진심으로 원하는 상태","아하 모먼트 = 사용자가 제품의 가치를 처음 깨닫는 순간","유지율 곡선이 수평으로 안정되면 PMF 달성 신호"],
     terms:["pmf"]},
    {id:"w2-4",title:"SEO, GEO, 바이럴 마케팅",
     content:"쉽게 말하면 이거야:\n구글 검색 맨 위에 내 웹사이트를 올리고, 사람들이 자발적으로 입소문을 내게 만드는 마법 같은 방법입니다.\n\nSEO(검색 엔진 최적화)는 사람들이 검색할 만한 키워드를 내 사이트 곳곳에 잘 심어서 검색 결과 상위에 노출되게 하는 작업입니다. 최근엔 ChatGPT 같은 AI 검색 엔진의 답변에 내 사이트가 등장하게 하는 GEO라는 새로운 개념도 중요해졌죠.",
     aiTip:"ChatGPT에게 '내 웹사이트 SEO를 높이는 10가지 방법 알려줘'라고 물어보세요.",
     practice:"내가 만들 제품 주제로 구글에서 사람들이 어떤 단어를 검색하는지 5가지 찾아보세요.",
     summary:["SEO = 검색 결과 상위 노출 최적화","GEO = AI 검색 엔진 최적화 (새로운 트렌드)","바이럴 = 사람들이 자발적으로 공유하게 만들기"],
     terms:["seo","geo","viral-marketing"]}
  ]},
  {id:"week3",title:"3주차: AI SaaS 만들기",desc:"React와 AI API를 연결해서 실제로 돈을 버는 AI 서비스를 만드는 방법을 배웁니다.",emoji:"3",lessons:[
    {id:"w3-1",title:"React란 무엇인가? — 레고 블록으로 웹 만들기",
     content:"쉽게 말하면 이거야:\n웹사이트 전체를 하나의 통짜로 만드는 게 아니라, '버튼', '메뉴바' 같은 레고 블록으로 예쁘게 조립하는 방식입니다.\n\n기존 HTML은 코드가 길어질수록 관리하기 너무 힘들었습니다. 그래서 나온 것이 React입니다. '버튼 컴포넌트'를 한 번 만들어두면 여러 곳에서 계속 재사용할 수 있죠. Vite라는 도구를 쓰면 터미널에 npx create-vite@latest 한 줄만 쳐도 개발 준비가 눈 깜짝할 새 끝납니다.",
     aiTip:"Cursor AI를 설치하고 '간단한 React 카운터 앱 만들어줘'라고 해보세요.",
     practice:"React 공식 홈페이지(react.dev)에 들어가서 인터랙티브 튜토리얼 첫 번째 단계만 해보세요.",
     summary:["React = 레고 블록(컴포넌트)을 조립해 웹 만들기","컴포넌트 한 번 만들면 여러 곳에 재사용 가능","Vite로 빠르게 React 프로젝트 시작 가능"],
     terms:["react","component","jsx","vite"]},
    {id:"w3-2",title:"서버리스와 Cloudflare Workers",
     content:"쉽게 말하면 이거야:\n진짜 컴퓨터 서버를 사서 관리할 필요 없이, 누군가 접속할 때만 잠깐씩 클라우드 서버를 빌려 쓰는 똑똑한 방식입니다.\n\n서버리스(Serverless)는 '서버 관리를 안 해도 된다'는 의미입니다. 내가 쓴 만큼만 실행되므로 비용이 거의 들지 않습니다. 특히 Cloudflare Workers를 쓰면 전 세계에 쫙 깔린 컴퓨터에서 내 코드가 실행되어 엄청 빠릅니다.",
     aiTip:"ChatGPT에게 'Cloudflare Workers로 간단한 API 만드는 방법 코드 예시로 보여줘'라고 해보세요.",
     practice:"Cloudflare.com에 접속해서 Workers & Pages 메뉴를 구경해보세요.",
     summary:["서버리스 = 서버 관리 없이 코드만 올리면 됨","쓴 만큼만 비용 발생 — 초기엔 거의 무료","Cloudflare Workers로 전 세계 어디서나 빠른 API"],
     terms:["serverless","cloudflare-workers"]},
    {id:"w3-3",title:"OpenAI API 연결하기 — 내 앱에 AI 심기",
     content:"쉽게 말하면 이거야:\nChatGPT의 천재적인 두뇌를 우리 웹사이트 안으로 몰래 가져와서 연결하는 거예요.\n\nAPI 키는 내가 OpenAI 서비스를 쓸 수 있게 해주는 특별한 비밀 열쇠입니다. 내 코드에서 이 열쇠와 함께 편지를 보내면, AI가 똑똑한 답변을 화면에 보여줍니다. 이때 AI에게 질문을 똑똑하게 던지는 걸 '프롬프트 엔지니어링'이라고 합니다.",
     aiTip:"ChatGPT에게 'OpenAI API를 React 앱에서 쓰는 최소한의 코드 보여줘'라고 해보세요.",
     practice:"platform.openai.com에 가입하고 API 키를 발급받아보세요. (처음엔 무료 크레딧 있음)",
     summary:["OpenAI API = ChatGPT 두뇌를 내 앱에 연결","API 키 = 서비스를 쓸 수 있는 비밀 열쇠","프롬프트를 잘 짜면 AI 답변 품질이 확 높아짐"],
     terms:["openai-api","prompt-engineering","api"]},
    {id:"w3-4",title:"글로벌 결제 — Polar로 세계에 팔기",
     content:"쉽게 말하면 이거야:\n복잡한 해외 세금과 환율 계산은 다 남한테 맡기고, 나는 온전히 제품 만들기에 집중하며 전 세계에서 돈을 받는 방법입니다.\n\nMOR(Merchant of Record)이라는 대행 서비스를 씁니다. Polar는 구독 결제를 쉽게 해주고 개발자가 붙이기 편한 대표적인 MOR 도구입니다. 처음부터 글로벌 타깃으로 영어 서비스를 만들어서 전 세계 사람들에게 팔아보세요!",
     aiTip:"ChatGPT에게 'Polar 결제 서비스를 React 앱에 연결하는 방법 알려줘'라고 해보세요.",
     practice:"polar.sh에 접속해서 어떤 결제 플랜이 있는지 구경해보세요.",
     summary:["MOR = 해외 세금/환율/법인 문제를 대신 처리해주는 서비스","Polar = 글로벌 구독 결제를 쉽게 붙일 수 있는 도구","처음부터 영어로 글로벌을 노려야 시장이 넓다"],

    {id:"w3-5",title:"UI 디자인 기초 — 보기 좋은 화면 만들기",

let page = {name:'home'};
const STORAGE_KEY = 'vibe_bootcamp_progress';
function getCompleted(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}
function toggleCompleted(id){
  const c=getCompleted();
  const idx=c.indexOf(id);
  if(idx===-1) c.push(id); else c.splice(idx,1);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(c));
}
function isCompleted(id){return getCompleted().includes(id)}
function totalLessons(){return curriculum.reduce((a,w)=>a+w.lessons.length,0)}
function completedCount(){const c=getCompleted();return curriculum.reduce((a,w)=>a+w.lessons.filter(l=>c.includes(l.id)).length,0)}

// ─── CONTENT PARSER ──────────────────────────────────────────────────────────
function parseContent(raw){
  const segs=[];
  const re=/```(\w+)?\n([\s\S]*?)```/g;
  let last=0,m;
  while((m=re.exec(raw))!==null){
    const before=raw.slice(last,m.index);
    if(before.trim()) parseText(before,segs);
    segs.push({type:'code',lang:m[1]||'html',code:m[2].trimEnd()});
    last=m.index+m[0].length;
  }
  const rem=raw.slice(last);
  if(rem.trim()) parseText(rem,segs);
  return segs;
}
function parseText(text,out){
  text.split(/\n\n+/).forEach(p=>{
    const t=p.trim();
    if(!t) return;
    if(t.startsWith('쉽게 말하면 이거야:'))
      out.push({type:'callout',text:t.replace(/^쉽게 말하면 이거야:\n?/,'')});
    else
      out.push({type:'para',text:t});
  });
}

// ─── RENDER HELPERS ──────────────────────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// Code store: JS 메모리에 원본 코드를 저장 (DOM 조회 없이 복사)
const _codeStore = {};
let _codeStoreIdx = 0;

function renderContentSegs(segs){
  return segs.map((s)=>{
    if(s.type==='callout') return `
      <div class="callout">
        <div class="callout-label">💡 쉽게 말하면 이거야!</div>
        <p>${esc(s.text)}</p>
      </div>`;
    if(s.type==='code'){
      const key='k'+(++_codeStoreIdx);
      _codeStore[key]=s.code;
      return `
      <div class="code-block">
        <div class="code-header">
          <div style="display:flex;align-items:center">
            <div class="code-dots"><span class="code-dot r"></span><span class="code-dot y"></span><span class="code-dot g"></span></div>
            <span class="code-lang" style="margin-left:10px">${esc(s.lang)}</span>
          </div>
          <button class="copy-btn" onclick="copyCode(this,'${key}')">📋 복사</button>
        </div>
        <pre>${esc(s.code)}</pre>
      </div>`;
    }
    return `<p>${esc(s.text)}</p>`;
  }).join('');
}

function copyCode(btn,key){
  const code=_codeStore[key];
  if(code===undefined){return;}
  const done=()=>{
    const prev=btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML='✅ 복사됨!';
    setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='📋 복사';},2000);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(()=>fallbackCopy(code,done));
  } else {
    fallbackCopy(code,done);
  }
}
function fallbackCopy(text,cb){
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus();ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb();
  }catch(e){console.warn('Copy failed',e);}
}

function renderLesson(wid,lid){
  const week=curriculum.find(w=>w.id===wid);
  if(!week) return '<div class="container"><p>찾을 수 없습니다.</p></div>';
  const lIdx=week.lessons.findIndex(l=>l.id===lid);
  if(lIdx===-1) return '<div class="container"><p>찾을 수 없습니다.</p></div>';
  const lesson=week.lessons[lIdx];
  const done=isCompleted(lesson.id);

  // prev/next
  let prev=null,next=null;
  if(lIdx>0) prev={wid,l:week.lessons[lIdx-1]};
  else{const wi=curriculum.indexOf(week);if(wi>0){const pw=curriculum[wi-1];prev={wid:pw.id,l:pw.lessons[pw.lessons.length-1]};}}
  if(lIdx<week.lessons.length-1) next={wid,l:week.lessons[lIdx+1]};
  else{const wi=curriculum.indexOf(week);if(wi<curriculum.length-1){const nw=curriculum[wi+1];next={wid:nw.id,l:nw.lessons[0]};}}

  const segs=parseContent(lesson.content);
  const terms=lesson.terms.map(tid=>g(tid)).filter(Boolean);

  return `<div class="container" style="padding-bottom:100px">
    <div class="back-link" onclick="navigate('week','${wid}')">‹ ${esc(week.title)}</div>
    <div class="lesson-title-main">${esc(lesson.title)}</div>
    ${done?`<div class="done-badge">✅ 학습 완료</div>`:''}
    <div class="content-body">${renderContentSegs(segs)}</div>
    ${terms.length?`<div class="card">
      <div class="card-title"><span class="card-title-icon">📖</span> 핵심 용어 카드</div>
      <div class="term-grid">${terms.map(t=>`<div class="term-item"><div class="term-name">${esc(t.term)}</div><div class="term-def">${esc(t.def)}</div></div>`).join('')}</div>
    </div>`:''}
    <div class="card">
      <div class="card-title"><span class="card-title-icon">🎓</span> 3줄 핵심 요약</div>
      <ul class="summary-list">${lesson.summary.map((s,i)=>`<li class="summary-item"><span class="summary-num">${i+1}</span><span>${esc(s)}</span></li>`).join('')}</ul>
    </div>
    ${lesson.aiTip?`<div class="ai-tip-card">
      <div class="card-title">✨ AI 활용 팁</div>
      <p>${esc(lesson.aiTip)}</p>
    </div>`:''}
    ${lesson.practice?`<div class="practice-card">
      <div class="card-title">▷ 지금 바로 해보기!</div>
      <p>${esc(lesson.practice)}</p>
    </div>`:''}
    <div class="complete-wrap">
      <button class="complete-btn ${done?'done':'default'}" onclick="handleComplete('${lesson.id}','${wid}','${lid}')">
        ${done?'✅ 완료됨 (취소하기)':'다 읽었어요! 완료하기'}
      </button>
    </div>
  </div>
  <div class="bottom-nav">
    <div class="bottom-nav-inner">
      ${prev?`<button class="nav-lesson-btn prev" onclick="navigate('lesson','${prev.wid}','${prev.l.id}')">
        ‹ <div class="nav-lesson-title"><span class="nav-lesson-small">이전</span><span>${esc(prev.l.title)}</span></div>
      </button>`:`<div style="flex:1"></div>`}
      <div class="nav-divider"></div>
      ${next?`<button class="nav-lesson-btn next" onclick="navigate('lesson','${next.wid}','${next.l.id}')">
        <div class="nav-lesson-title"><span class="nav-lesson-small">다음</span><span>${esc(next.l.title)}</span></div> ›
      </button>`:`<button class="nav-lesson-btn next" onclick="navigate('home')">홈으로 ›</button>`}
    </div>
  </div>`;
}

function handleComplete(lid,wid,lessonId){
  toggleCompleted(lid);
  navigate('lesson',wid,lessonId);
  if(!isCompleted(lid)){
    const cel=document.createElement('div');
    cel.className='celebrate';cel.textContent='참 잘했어요! 🎉';
    document.body.appendChild(cel);
    setTimeout(()=>cel.remove(),1600);
  }
}

function renderGlossary(){
  return `<div class="container">
    <div class="section-title" style="margin-bottom:20px">📖 용어 사전</div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="search" placeholder="용어 검색..." oninput="filterGlossary(this.value)" id="glossary-search">
    </div>
    <div class="glossary-grid" id="glossary-grid">
      ${glossary.map(t=>`<div class="glossary-card" data-term="${esc(t.term.toLowerCase())} ${esc(t.def.toLowerCase())}">
        <div class="glossary-term">${esc(t.term)}</div>
        <div class="glossary-def">${esc(t.def)}</div>
      </div>`).join('')}
    </div>
    <div class="footer">이 웹사이트는 조코딩의 1인 창업 부트캠프 자율학습용 보조 앱입니다.</div>
  </div>`;
}

function filterGlossary(q){
  const grid=document.getElementById('glossary-grid');
  if(!grid) return;
  const cards=[...grid.querySelectorAll('.glossary-card')];
  const kw=q.toLowerCase().trim();
  let shown=0;
  cards.forEach(c=>{
    const match=!kw||c.dataset.term.includes(kw);
    c.style.display=match?'':'none';
    if(match) shown++;
  });
  let noRes=document.getElementById('no-results');
  if(!shown){
    if(!noRes){noRes=document.createElement('div');noRes.id='no-results';noRes.className='no-results';noRes.textContent='검색 결과가 없습니다.';grid.after(noRes);}
  } else if(noRes) noRes.remove();
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(page.name==='home') app.innerHTML=renderHome();
  else if(page.name==='week') app.innerHTML=renderWeek(page.id);
  else if(page.name==='lesson') app.innerHTML=renderLesson(page.id,page.lid);
  else if(page.name==='glossary') app.innerHTML=renderGlossary();
}

render();
updateNavActive();
</script>
</body>
</html>
