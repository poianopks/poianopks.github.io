<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e5e7eb;--ink:#111827;--m:#6b7280;--a:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.w{max-width:900px;margin:0 auto;padding:1.25rem 1rem 2.5rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.75rem}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:.85rem;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(0,0,0,.04)}
a.card:hover{border-color:#93c5fd}
.t{font-weight:700;margin:0 0 .25rem}.d{color:var(--m);font-size:.88rem;margin:0}.tag{display:inline-block;font-size:.72rem;background:#eff6ff;color:#1e40af;padding:.12rem .4rem;border-radius:.3rem;margin-bottom:.35rem}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:.6rem;padding:.75rem;font-size:.9rem;color:#92400e;margin:1rem 0}
</style>
</head>
<body>
