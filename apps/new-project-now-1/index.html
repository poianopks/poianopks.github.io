<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>웹툰 카메라</title>
<meta name="description" content="사진을 찍어 웹툰·어린이 만화·치비·픽사 스타일로 바꿔 보는 카메라 앱 (정적판)" />
<meta name="theme-color" content="#0C0C0F" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6015033382241125" crossorigin="anonymous"></script>
<style>
:root{--bg:#0C0C0F;--fg:#fff;--card:#1A1A22;--primary:#FF6B35;--muted:#8888A0;--accent:#FFD700;--danger:#FF3B3B;--border:#2A2A38}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Inter,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
/* camera */
#cam{background:#000}
#video,#camFallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#video.mirror{transform:scaleX(-1)}
#camFallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center}
#camFallback h2{font-size:22px;font-weight:700}
#camFallback p{color:var(--muted);font-size:15px;line-height:1.5}
.pill{padding:14px 32px;border-radius:28px;background:var(--primary);color:#fff;font-weight:600;font-size:16px}
.topBar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px}
.iconBtn{width:44px;height:44px;border-radius:22px;background:rgba(0,0,0,.4);display:grid;place-items:center}
.modeToggle{display:flex;background:rgba(0,0,0,.5);border-radius:20px;padding:3px}
.modeBtn{padding:6px 16px;border-radius:16px;font-size:13px;font-weight:600;color:rgba(255,255,255,.6)}
.modeBtn.active{background:var(--primary);color:#fff}
.styleSection{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 160px);overflow-x:auto;scrollbar-width:none}
.styleSection::-webkit-scrollbar{display:none}
.styleScroll{display:flex;gap:8px;padding:0 16px;width:max-content}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);text-align:left}
.chip.active{background:var(--primary);border-color:var(--primary)}
.chip .em{font-size:20px}
.chip b{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.9)}
.chip small{display:block;font-size:10px;color:rgba(255,255,255,.5)}
.chip.active b{color:#fff}.chip.active small{color:rgba(255,255,255,.8)}
.activeBadge{position:absolute;left:0;right:0;text-align:center;bottom:calc(env(safe-area-inset-bottom) + 130px);font-size:12px;font-weight:600;color:var(--accent)}
.bottomBar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:0 32px calc(env(safe-area-inset-bottom) + 20px)}
.roundBtn{width:52px;height:52px;border-radius:26px;background:rgba(0,0,0,.5);display:grid;place-items:center}
.shutter{width:80px;height:80px;border-radius:40px;border:4px solid #fff;display:grid;place-items:center}
.shutter i{display:block;width:64px;height:64px;border-radius:32px;background:#fff;transition:all .2s}
.shutter.rec{border-color:var(--danger)}
.shutter.rec i{width:28px;height:28px;border-radius:6px;background:var(--danger)}
.shutter.video i{background:var(--danger)}
.recTime{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--danger);display:none}
.back{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 64px);font-size:11px;color:rgba(255,255,255,.6);text-decoration:none;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:8px}
/* result */
#res{background:var(--bg)}
.header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 20px 12px}
.headerBtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--card)}
.headerBtn.primary{background:var(--primary)}
.headerBtn.ghost{background:none;visibility:hidden}
.headerTitle{font-size:17px;font-weight:600}
.imgBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px}
.imgWrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;animation:fade .6s ease both}
.imgWrap img,.imgWrap video{max-width:100%;max-height:100%;border-radius:16px;object-fit:contain}
.badge{position:absolute;top:12px;right:12px;padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;background:rgba(255,107,53,.9)}
.badge.orig{background:rgba(0,0,0,.6)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.loadCircle{width:88px;height:88px;border-radius:44px;background:var(--primary);display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite;margin-bottom:8px}
.loading h3{font-size:22px;font-weight:700}
.loading p{font-size:14px;color:var(--muted)}
.note{display:flex;align-items:flex-start;gap:8px;padding:12px;border-radius:12px;background:var(--card);margin:12px 20px 0;font-size:13px;color:var(--muted);line-height:1.5}
.note svg{flex:0 0 auto;margin-top:2px}
.actions{display:flex;gap:12px;padding:12px 20px calc(env(safe-area-inset-bottom) + 16px)}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0;border-radius:28px;background:var(--card);font-size:15px;font-weight:600;white-space:nowrap}
.act.primary{flex:1.2;background:var(--primary);color:#fff}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(26,26,34,.95);border:1px solid var(--border);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<!-- Camera screen -->
<section id="cam" class="screen">
  <video id="video" autoplay playsinline muted></video>
  <div id="camFallback" hidden>
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <h2>카메라 권한 필요</h2>
    <p id="camMsg">웹툰 카메라 앱을 사용하려면<br>카메라와 마이크 권한이 필요합니다</p>
    <button class="pill" id="permBtn">권한 허용하기</button>
    <p style="font-size:13px">카메라 없이도 왼쪽 아래 <b>갤러리</b> 버튼으로 사진을 불러올 수 있어요.</p>
  </div>

  <div class="topBar">
    <button class="iconBtn" id="flashBtn" aria-label="플래시"></button>
    <div class="modeToggle">
      <button class="modeBtn active" data-mode="photo">사진</button>
      <button class="modeBtn" data-mode="video">동영상</button>
    </div>
    <div style="width:44px"></div>
  </div>
  <a class="back" href="../">← 앱 모음</a>
  <div class="recTime" id="recTime"></div>

  <div class="styleSection"><div class="styleScroll" id="styles"></div></div>
  <div class="activeBadge" id="activeBadge"></div>

  <div class="bottomBar">
    <button class="roundBtn" id="galleryBtn" aria-label="갤러리">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <button class="shutter" id="shutter" aria-label="촬영"><i></i></button>
    <button class="roundBtn" id="flipBtn" aria-label="카메라 전환">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M9 13a3 3 0 0 1 5.2-2"/><polyline points="14.5 9 14.5 11.2 12.3 11.2"/><path d="M15 13a3 3 0 0 1-5.2 2"/><polyline points="9.5 17 9.5 14.8 11.7 14.8"/></svg>
    </button>
  </div>
  <input type="file" id="fileInput" accept="image/*,video/*" hidden />
</section>

<!-- Result screen -->
<section id="res" class="screen">
  <div class="header">
    <button class="headerBtn" id="backBtn" aria-label="뒤로">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="headerTitle" id="resTitle"></div>
    <button class="headerBtn primary" id="toggleOrig" aria-label="원본/변환 전환"></button>
  </div>
  <div class="imgBox" id="imgBox"></div>
  <div class="note" id="resNote"></div>
  <div class="actions">
    <button class="act" id="retake">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>다시 찍기
    </button>
    <button class="act primary" id="saveBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>저장
    </button>
    <button class="act" id="shareBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>공유
    </button>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
(function(){
  var STYLES=[
    {id:"webtoon",emoji:"🎨",label:"웹툰",desc:"한국 웹툰 스타일",full:"웹툰"},
    {id:"child",emoji:"🧒",label:"어린이",desc:"동화책 어린이 캐릭터",full:"어린이 만화"},
    {id:"chibi",emoji:"🌟",label:"치비",desc:"귀여운 SD 애니",full:"치비 애니"},
    {id:"pixar",emoji:"🎬",label:"픽사",desc:"3D 애니메이션 영화",full:"픽사 3D"}
  ];
  var $=function(id){return document.getElementById(id)};
  var state={mode:"photo",facing:"environment",flash:"off",style:"webtoon",stream:null,recorder:null,chunks:[],recStart:0,recTimer:null,result:null,showOriginal:false};
  try{var s=localStorage.getItem("webtoon-cam-style");if(s&&STYLES.some(function(x){return x.id===s}))state.style=s;}catch(e){}

  function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on")},2400);}

  /* flash icon (UI only on web; uses torch when the device supports it) */
  var FLASH_ICONS={
    off:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 13 9 19 9"/><path d="M16 15l-5 7v-5H5l3-4.5"/><line x1="2" y1="2" x2="22" y2="22"/></svg>',
    on:'<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    auto:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'
  };
  function renderFlash(){$("flashBtn").innerHTML=FLASH_ICONS[state.flash];}
  $("flashBtn").onclick=function(){
    state.flash=state.flash==="off"?"on":state.flash==="on"?"auto":"off";renderFlash();
    var track=state.stream&&state.stream.getVideoTracks()[0];
    try{var caps=track&&track.getCapabilities&&track.getCapabilities();if(caps&&caps.torch){track.applyConstraints({advanced:[{torch:state.flash==="on"}]});}}catch(e){}
  };

  function renderStyles(){
    $("styles").innerHTML=STYLES.map(function(s){
      return '<button class="chip'+(s.id===state.style?' active':'')+'" data-id="'+s.id+'"><span class="em">'+s.emoji+'</span><span><b>'+s.label+'</b><small>'+s.desc+'</small></span></button>';
    }).join("");
    var cur=STYLES.find(function(s){return s.id===state.style});
    $("activeBadge").textContent=cur.emoji+" "+cur.label+" 모드";
  }
  $("styles").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;state.style=b.dataset.id;try{localStorage.setItem("webtoon-cam-style",state.style)}catch(x){}renderStyles();};

  document.querySelectorAll(".modeBtn").forEach(function(b){
    b.onclick=function(){if(state.recorder)return;state.mode=b.dataset.mode;document.querySelectorAll(".modeBtn").forEach(function(x){x.classList.toggle("active",x===b)});$("shutter").classList.toggle("video",state.mode==="video");};
  });

  function stopStream(){if(state.stream){state.stream.getTracks().forEach(function(t){t.stop()});state.stream=null;}}
  function showFallback(msg){$("video").hidden=true;$("camFallback").hidden=false;if(msg)$("camMsg").innerHTML=msg;}
  function startCamera(){
    stopStream();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showFallback("이 브라우저에서는 카메라를 사용할 수 없어요.<br>HTTPS 환경과 최신 브라우저에서 열어 주세요.");return;}
    navigator.mediaDevices.getUserMedia({video:{facingMode:state.facing},audio:state.mode==="video"}).catch(function(){
      return navigator.mediaDevices.getUserMedia({video:{facingMode:state.facing},audio:false});
    }).then(function(st){
      state.stream=st;var v=$("video");v.srcObject=st;v.hidden=false;$("camFallback").hidden=true;
      v.classList.toggle("mirror",state.facing==="user");
    }).catch(function(){showFallback("웹툰 카메라 앱을 사용하려면<br>카메라와 마이크 권한이 필요합니다");});
  }
  $("permBtn").onclick=startCamera;
  $("flipBtn").onclick=function(){if(state.recorder)return;state.facing=state.facing==="environment"?"user":"environment";startCamera();};

  function takePhoto(){
    var v=$("video");
    if(!state.stream||!v.videoWidth){toast("카메라가 준비되지 않았어요. 갤러리에서 사진을 골라 보세요.");return;}
    var c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;var ctx=c.getContext("2d");
    if(state.facing==="user"){ctx.translate(c.width,0);ctx.scale(-1,1);}
    ctx.drawImage(v,0,0);
    if(state.flash!=="off"){document.body.style.background="#fff";setTimeout(function(){document.body.style.background=""},120);}
    openResult({type:"photo",uri:c.toDataURL("image/jpeg",0.85),style:state.style});
  }
  function startRec(){
    if(!state.stream||typeof MediaRecorder==="undefined"){toast("이 브라우저에서는 동영상 녹화를 지원하지 않아요.");return;}
    var rec;try{rec=new MediaRecorder(state.stream);}catch(e){toast("동영상 녹화에 실패했습니다.");return;}
    state.chunks=[];state.recorder=rec;
    rec.ondataavailable=function(e){if(e.data&&e.data.size)state.chunks.push(e.data)};
    rec.onstop=function(){
      clearInterval(state.recTimer);$("recTime").style.display="none";$("shutter").classList.remove("rec");
      var blob=new Blob(state.chunks,{type:rec.mimeType||"video/webm"});state.recorder=null;
      openResult({type:"video",uri:URL.createObjectURL(blob),blob:blob,style:state.style});
    };
    rec.start();state.recStart=Date.now();$("shutter").classList.add("rec");
    var rt=$("recTime");rt.style.display="block";rt.textContent="● 0:00";
    state.recTimer=setInterval(function(){var s=Math.floor((Date.now()-state.recStart)/1000);rt.textContent="● 0:"+String(s).padStart(2,"0");if(s>=30)rec.stop();},250);
  }
  $("shutter").onclick=function(){
    if(state.mode==="photo")takePhoto();
    else if(state.recorder)state.recorder.stop();
    else startRec();
  };
  $("galleryBtn").onclick=function(){$("fileInput").click()};
  $("fileInput").onchange=function(){
    var f=this.files&&this.files[0];this.value="";if(!f)return;
    if(f.type.indexOf("video")===0){openResult({type:"video",uri:URL.createObjectURL(f),blob:f,style:state.style});return;}
    var r=new FileReader();r.onload=function(){openResult({type:"photo",uri:r.result,style:state.style})};r.readAsDataURL(f);
  };

  /* ----- local cartoon filter (replaces the server-side AI transform) ----- */
  function cartoonize(src,style,cb){
    var img=new Image();
    img.onload=function(){
      var max=1280,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      var c=document.createElement("canvas");c.width=w;c.height=h;var ctx=c.getContext("2d");
      var blur={webtoon:2,child:3,chibi:3,pixar:4}[style]||2;
      ctx.filter="blur("+blur+"px)";ctx.drawImage(img,0,0,w,h);ctx.filter="none";
      var smooth=ctx.getImageData(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);var orig=ctx.getImageData(0,0,w,h);
      var levels={webtoon:6,child:5,chibi:4,pixar:8}[style]||6;
      var sat={webtoon:1.35,child:1.5,chibi:1.6,pixar:1.25}[style]||1.3;
      var warm={webtoon:0,child:12,chibi:8,pixar:6}[style]||0;
      var edgeT={webtoon:38,child:55,chibi:60,pixar:80}[style]||40;
      var d=smooth.data,o=orig.data,out=ctx.createImageData(w,h),q=out.data,step=255/(levels-1);
      var gray=new Float32Array(w*h);
      for(var i=0,p=0;i<o.length;i+=4,p++)gray[p]=o[i]*.299+o[i+1]*.587+o[i+2]*.114;
      for(var y=0;y<h;y++)for(var x=0;x<w;x++){
        var p2=y*w+x,i2=p2*4;
        var r=d[i2],g=d[i2+1],b=d[i2+2],l=(r+g+b)/3;
        r=l+(r-l)*sat+warm;g=l+(g-l)*sat+warm*.4;b=l+(b-l)*sat-warm*.3;
        r=Math.round(Math.max(0,Math.min(255,r))/step)*step;g=Math.round(Math.max(0,Math.min(255,g))/step)*step;b=Math.round(Math.max(0,Math.min(255,b))/step)*step;
        var e=0;
        if(x>0&&y>0&&x<w-1&&y<h-1){
          var gx=-gray[p2-w-1]-2*gray[p2-1]-gray[p2+w-1]+gray[p2-w+1]+2*gray[p2+1]+gray[p2+w+1];
          var gy=-gray[p2-w-1]-2*gray[p2-w]-gray[p2-w+1]+gray[p2+w-1]+2*gray[p2+w]+gray[p2+w+1];
          e=Math.sqrt(gx*gx+gy*gy);
        }
        if(e>edgeT*3){r*=.15;g*=.15;b*=.15;}else if(e>edgeT*2){r*=.55;g*=.55;b*=.55;}
        q[i2]=r;q[i2+1]=g;q[i2+2]=b;q[i2+3]=255;
      }
      ctx.putImageData(out,0,0);
      if(style==="pixar"){var gr=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.7);gr.addColorStop(0,"rgba(255,240,220,0.10)");gr.addColorStop(1,"rgba(20,10,40,0.30)");ctx.fillStyle=gr;ctx.fillRect(0,0,w,h);}
      cb(c.toDataURL("image/png"));
    };
    img.onerror=function(){cb(null)};
    img.src=src;
  }

  function styleFull(id){var s=STYLES.find(function(x){return x.id===id});return s?s.full:"웹툰";}
  function openResult(r){state.result=r;state.showOriginal=false;r.converted=null;location.hash="#/result";if(r.type==="photo"){renderResult(true);setTimeout(function(){cartoonize(r.uri,r.style,function(u){if(state.result!==r)return;r.converted=u;renderResult();})},350);}else renderResult();}

  var INFO='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
  function renderResult(loading){
    var r=state.result;if(!r)return;
    var isVideo=r.type==="video";
    $("resTitle").textContent=isVideo?"동영상":state.showOriginal?"원본 사진":styleFull(r.style)+" 변환";
    var tg=$("toggleOrig");
    if(!isVideo&&r.converted){tg.classList.remove("ghost");tg.classList.toggle("primary",!state.showOriginal);
      tg.innerHTML=state.showOriginal?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
    }else{tg.classList.add("ghost");tg.innerHTML="";}
    var box=$("imgBox");
    if(loading){
      box.innerHTML='<div class="loading"><div class="loadCircle"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><h3>웹툰으로 변환 중...</h3><p>만화 스타일로 변환하고 있습니다</p></div>';
    }else if(isVideo){
      box.innerHTML='<div class="imgWrap"><video src="'+r.uri+'" controls playsinline></video><span class="badge orig" style="left:12px;right:auto">🎥 동영상</span></div>';
    }else{
      var src=state.showOriginal||!r.converted?r.uri:r.converted;
      box.innerHTML='<div class="imgWrap"><img alt="결과 이미지" src="'+src+'"/>'+(r.converted?'<span class="badge'+(state.showOriginal?' orig':'')+'">'+(state.showOriginal?'원본':'웹툰')+'</span>':'')+'</div>';
    }
    $("resNote").innerHTML=INFO+'<span>'+(isVideo?'동영상 AI 변환은 사진 모드를 이용해 주세요':'정적 버전에서는 서버 AI 변환 기능을 사용할 수 없어, 기기 안에서 만화풍 필터로 대신 변환했어요. 사진은 어디에도 업로드되지 않습니다.')+'</span>';
    var ready=isVideo||!!r.converted;
    $("saveBtn").style.display=ready?"":"none";$("shareBtn").style.display=ready?"":"none";
  }
  $("toggleOrig").onclick=function(){state.showOriginal=!state.showOriginal;renderResult();};
  $("backBtn").onclick=$("retake").onclick=function(){location.hash="#/";};

  function dataUrlToBlob(u){var a=u.split(","),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]),n=b.length,arr=new Uint8Array(n);while(n--)arr[n]=b.charCodeAt(n);return new Blob([arr],{type:m});}
  function currentFile(){
    var r=state.result;if(!r)return null;
    if(r.type==="video"){var ext=(r.blob&&r.blob.type.indexOf("mp4")>=0)?"mp4":"webm";return new File([r.blob],"webtoon_"+Date.now()+"."+ext,{type:r.blob.type||"video/webm"});}
    if(!r.converted)return null;return new File([dataUrlToBlob(r.converted)],"webtoon_"+Date.now()+".png",{type:"image/png"});
  }
  $("saveBtn").onclick=function(){
    var f=currentFile();if(!f)return;
    var a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
    toast("저장 완료 · 다운로드 폴더를 확인하세요!");
  };
  $("shareBtn").onclick=function(){
    var f=currentFile();if(!f)return;
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"웹툰 카메라"}).catch(function(){});}
    else toast("이 브라우저는 파일 공유를 지원하지 않아요. 저장 후 공유해 주세요.");
  };

  function route(){
    var onResult=location.hash==="#/result"&&state.result;
    $("cam").classList.toggle("on",!onResult);$("res").classList.toggle("on",!!onResult);
    if(onResult){stopStream();}
    else{if(location.hash==="#/result")history.replaceState(null,"","#/");startCamera();}
  }
  window.addEventListener("hashchange",route);
  renderFlash();renderStyles();route();
})();
</script>
</body>
</html>
