<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 챗봇 (정적판)</title>
<meta name="description" content="Replit의 'AI Chatbot' 프로젝트 정적 보관판. 원본은 거의 빈 템플릿이었으며, 정적 버전에서는 AI 응답을 사용할 수 없습니다." />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6015033382241125" crossorigin="anonymous"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--muted:#64748b;--pri:#4f46e5;--pri-soft:#eef2ff;--warn-bg:#fff7ed;--warn:#9a3412}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#f97316}
header a{font-size:13px;color:var(--muted);text-decoration:none}
header a:hover{color:var(--pri)}
.notice{max-width:760px;width:calc(100% - 32px);margin:12px auto 0;background:var(--warn-bg);color:var(--warn);border:1px solid #fed7aa;border-radius:12px;padding:10px 14px;font-size:13px}
#log{flex:1;overflow-y:auto;max-width:760px;width:100%;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
form{background:var(--card);border-top:1px solid var(--line);padding:12px 16px}
.row{max-width:760px;margin:0 auto;display:flex;gap:8px}
input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;outline:none}
input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
button{border:0;border-radius:12px;padding:0 18px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.clear{background:none;color:var(--muted);font-size:12px;padding:4px 0;margin-top:6px;display:block;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<header>
  <h1><span class="dot" aria-hidden="true"></span>AI 챗봇</h1>
  <a href="../">← 앱 모음</a>
</header>
<p class="notice">⚠️ 정적 버전에서는 AI 응답 기능을 사용할 수 없습니다. (AI 기능에는 서버와 비밀 API 키가 필요해 GitHub Pages에서는 동작하지 않아요.) 원본 Replit 프로젝트는 거의 빈 템플릿이었습니다. 입력한 대화는 이 기기에만 저장됩니다.</p>
<main id="log" aria-live="polite"></main>
<form id="f">
  <div class="row">
    <input id="q" autocomplete="off" placeholder="메시지를 입력하세요..." aria-label="메시지" />
    <button type="submit">보내기</button>
  </div>
  <button type="button" class="clear" id="clear">대화 지우기</button>
</form>
<script>
(function(){
  var KEY="ai-chatbot-static-log",log=[];
  try{log=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){}
  var el=document.getElementById("log");
  var REPLY="죄송해요. 이 정적 버전에서는 AI 응답을 생성할 수 없습니다. 🙏\nAI 기능은 서버와 API 키가 필요해 GitHub Pages에서는 비활성화되어 있어요.";
  function save(){try{localStorage.setItem(KEY,JSON.stringify(log.slice(-200)))}catch(e){}}
  function render(){
    el.innerHTML="";
    if(!log.length){var d=document.createElement("div");d.className="empty";d.innerHTML="<b>무엇이든 물어보세요</b>메시지를 보내면 대화 기록이 여기에 표시됩니다.";el.appendChild(d);return;}
    log.forEach(function(m){var d=document.createElement("div");d.className="msg "+(m.r==="u"?"me":"bot");d.textContent=m.t;el.appendChild(d);});
    el.scrollTop=el.scrollHeight;
  }
  document.getElementById("f").onsubmit=function(e){
    e.preventDefault();var q=document.getElementById("q"),t=q.value.trim();if(!t)return;
    log.push({r:"u",t:t});q.value="";render();save();
    setTimeout(function(){log.push({r:"b",t:REPLY});render();save();},400);
  };
  document.getElementById("clear").onclick=function(){log=[];save();render();};
  render();
})();
</script>
</body>
</html>
