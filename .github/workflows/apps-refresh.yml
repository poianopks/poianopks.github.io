name: 앱 모음 데이터 갱신

# apps/ 의 GitHub Pages 보관판(경제나침반, 뉴스 대시보드, 밸류미터, Stock Sense 등) 데이터를
# GitHub 자체 스크립트(_ports/) 또는 Replit 원본 앱의 API에서 다시 받아 옵니다. (시간은 UTC, 한국 = UTC+9)
# Replit 앱을 하루 몇 번만 깨우므로 Replit 요금 영향은 아주 적습니다.
# 코스피 저평가 탐색기 2종(stock-finder, kospi-screener)은 Replit 없이 네이버 증권에서 직접 받습니다.
on:
  schedule:
    - cron: "41 23 * * 0-4"   # 08:41 장 시작 전
    - cron: "13 3 * * 1-5"    # 12:13 점심
    - cron: "11 7 * * 1-5"    # 16:11 장 마감 뒤
    - cron: "23 0 * * 6"      # 토요일 09:23 (미국 금요일 마감 반영)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: GitHub 자체 스크립트로 데이터 만들기 (_ports, Replit 불필요)
        continue-on-error: true
        run: |
          for d in _ports/*/; do
            echo "::group::$d"
            (cd "$d" && npm ci --no-audit --no-fund && timeout 900 npm run data) || echo "⚠️ $d 실패 (예전 데이터 유지)"
            echo "::endgroup::"
          done
          python .github/scripts/refresh_apps.py --stamp-ported

      - name: Replit 원본에서 데이터 받기 (API 키가 필요한 3개 앱)
        continue-on-error: true
        run: python .github/scripts/refresh_apps.py

      - name: 코스피 저평가 탐색기 2종 네이버 증권에서 직접 받기
        continue-on-error: true
        run: python .github/scripts/refresh_stock_snapshots.py

      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          # 보호: 자동 갱신은 apps/ 폴더만 저장합니다. robots.txt·sitemap.xml 등 다른 파일은 절대 건드리지 않음 (애드센스 재심사용, Aside 관리)
          if git diff --cached --name-only | grep -v "^apps/"; then echo "::error::apps/ 밖의 파일이 바뀌어 저장을 멈춥니다"; exit 1; fi
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "앱 모음 데이터 자동 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi
