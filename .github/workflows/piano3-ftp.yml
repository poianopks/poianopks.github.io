# piano3.com 배달부: GitHub Actions가 FTP로 홈페이지 파일을 올려요.
# 접속 정보는 저장소 Settings → Secrets and variables → Actions 에 넣어요(코드에는 없음).
#   FTP2_SERVER   FTP 주소
#   FTP2_USERNAME FTP 아이디
#   FTP2_PASSWORD FTP 비밀번호
#   FTP2_DIR      홈페이지 폴더 (예: /www 또는 /public_html). 'list'로 먼저 확인해요
name: piano3.com 배달부 (FTP)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = 서버 폴더 목록만 보기 / upload = _piano3/site 올리기"
        type: choice
        options: [list, upload]
        default: list
  push:
    branches: [main]
    paths: ["_piano3/site/**"]

concurrency: piano3-ftp

jobs:
  ftp:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP2_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP2_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP2_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP2_DIR }}
      MODE: ${{ github.event_name == 'push' && 'upload' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: 접속 정보가 있는지 확인
        run: |
          miss=""
          [ -n "$FTP_SERVER" ] || miss="$miss FTP2_SERVER"
          [ -n "$FTP_USERNAME" ] || miss="$miss FTP2_USERNAME"
          [ -n "$LFTP_PASSWORD" ] || miss="$miss FTP2_PASSWORD"
          if [ "$MODE" = upload ] && [ -z "$FTP_DIR" ]; then miss="$miss FTP2_DIR"; fi
          if [ -n "$miss" ]; then echo "::error::GitHub Secrets에 다음이 없어요:$miss"; exit 1; fi

      - name: lftp 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: 서버 연결 점검 (주소·포트만 확인, 로그인 안 함)
        if: env.MODE == 'list'
        run: |
          echo "== 주소 찾기"; getent hosts "$FTP_SERVER" | awk '{print "IP 찾음 (" NF " 항목)"}' || echo "주소를 찾지 못했어요"
          for p in 21 22; do
            if timeout 12 bash -c "exec 3<>/dev/tcp/$FTP_SERVER/$p" 2>/dev/null; then echo "포트 $p: 열려 있음"; else echo "포트 $p: 응답 없음(막힘)"; fi
          done
          echo "== FTP 첫 인사(배너)"; timeout 12 bash -c "exec 3<>/dev/tcp/$FTP_SERVER/21; head -c 200 <&3" 2>/dev/null | tr -d '\r' || echo "배너 없음"
          echo "== 이 GitHub 컴퓨터의 나라"; curl -s --max-time 10 https://ipinfo.io/country || true

      - name: 서버 폴더 목록 보기 (list, 아무것도 바꾸지 않음)
        if: env.MODE == 'list'
        run: |
          lftp -c "set ftp:ssl-allow yes; set net:max-retries 2; set net:timeout 20;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            echo '== 로그인 직후 위치'; pwd; cls -1 --sort=name -F;
            echo '== FTP_DIR'; cd \"${FTP_DIR:-.}\" && cls -1 --sort=name -F"

      - name: _piano3/site 올리기 (upload, 서버 파일은 지우지 않음)
        if: env.MODE == 'upload'
        run: |
          [ -d _piano3/site ] || { echo "::error::_piano3/site 폴더가 없어요"; exit 1; }
          lftp -c "set ftp:ssl-allow yes; set net:max-retries 2; set net:timeout 20;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            mirror -R --verbose --no-perms --only-newer _piano3/site \"$FTP_DIR\""
