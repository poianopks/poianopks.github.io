name: 소녀의 기도 악보 받기 (임시)
on:
  push:
    branches: [ccr-fa0a0572-a9a9in]
    paths: [_tools/fetch_prayer.py]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _tools/fetch_prayer.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tools/prayer && git commit -m "임시: 소녀의 기도 원본 자료" && git push origin HEAD:ccr-fa0a0572-a9a9in
