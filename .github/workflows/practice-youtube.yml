name: 연습장 - 유튜브 내용 가져오기

# 연습용. 작업 브랜치에 push할 때만 실행됩니다 (사이트 main과 무관).
on:
  push:
    branches: [ccr-a3195313-ux8oj3]
    paths:
      - "practice/youtube/fetch.py"
      - ".github/workflows/practice-youtube.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp youtube-transcript-api
      - run: python practice/youtube/fetch.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add practice/youtube/result.md
          git commit -m "연습장: 유튜브 내용 결과" || exit 0
          git pull --rebase -q || true
          git push
