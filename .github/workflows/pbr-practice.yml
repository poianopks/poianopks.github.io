name: PBR 연습 계산 (읽기 전용)

# 삼성전자·SK하이닉스 참고형 PBR을 계산해 Actions 요약 화면과 첨부파일로만 남깁니다.
# contents: read 권한이라 저장소(사이트)에는 아무것도 쓰지 않습니다.
on:
  push:
    branches: [claude/github-actions-practice-8rdg3u]
    paths:
      - ".github/scripts/pbr_ref.py"
      - ".github/workflows/pbr-practice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pbr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 참고형 PBR 계산
        run: python .github/scripts/pbr_ref.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbr-ref
          path: out/
