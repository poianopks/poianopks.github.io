name: cld_eco 주식 데이터 갱신

# KOSPI 투자 분석 센터(https://poianopks.github.io/cld_eco/)의 데이터를
# 공개 시세(Yahoo Finance·네이버 증권 등)로 새로 받아 cld_eco/ 폴더를 다시 만듭니다.
# GitHub 예약 실행은 몇 분~수십 분 늦을 수 있어, 중요한 시각에는 여러 번 걸어 둡니다. (시간은 UTC, 한국 = UTC+9)
on:
  schedule:
    - cron: "17 * * * *"          # 1시간마다
    - cron: "5,35 0-6 * * 1-5"    # 한국 장중 30분마다 (09:05~15:35)
    - cron: "50 6 * * 1-5"        # 15:50 장 마감 직후
    - cron: "40 7 * * 1-5"        # 16:40 투자자별 수급 확정 뒤
    - cron: "10,40 21 * * 1-5"    # 06:10·06:40 미국 장 마감 직후
    - cron: "20 23 * * 0-4"       # 08:20 장 시작 전
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_cld_eco_src/**"
      - ".github/workflows/cld-eco.yml"

permissions:
  contents: write

concurrency:
  group: cld-eco
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _cld_eco_src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _cld_eco_src/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: 공개 시세 수집
        run: npm run data

      - name: 정적 사이트 빌드
        run: npm run build
        env:
          BASE_PATH: /cld_eco/

      - name: cld_eco/ 폴더 교체 후 저장
        run: |
          rm -rf ../cld_eco
          cp -r dist ../cld_eco
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cld_eco
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "cld_eco 데이터 자동 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
