name: 연습장 - KOSPI 연속 하락 계산

# 연습용. main(사이트)에는 반응하지 않고, 작업 브랜치에 push할 때만 실행됩니다.
on:
  push:
    branches: [ccr-a3195313-ux8oj3]
    paths:
      - "practice/kospi_streak/streak.py"
      - "practice/kospi_streak/verify_naver.py"
      - "practice/kospi_streak/overnight.py"
      - "practice/kospi_streak/trend.py"
      - "practice/reservoir/backtest.py"
      - "practice/pbr/pbr_crash.py"
      - "practice/semi95/compare.py"
      - "practice/semi95/vs_dotcom.py"
      - "practice/semi95/rates.py"
      - "practice/closing/auction.py"
      - "practice/kospi_streak/after_jump.py"
      - ".github/workflows/practice-kospi-streak.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python practice/kospi_streak/streak.py
      - run: python practice/kospi_streak/verify_naver.py
      - run: python practice/kospi_streak/overnight.py
      - run: python practice/kospi_streak/trend.py
      - run: python practice/reservoir/backtest.py
      - run: python practice/pbr/pbr_crash.py
      - run: python practice/semi95/compare.py
      - run: python practice/semi95/vs_dotcom.py
      - run: python practice/semi95/rates.py
      - run: python practice/closing/auction.py
      - run: python practice/kospi_streak/after_jump.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add practice/kospi_streak/result.md practice/kospi_streak/verify_naver.md practice/kospi_streak/overnight.md practice/kospi_streak/trend.md practice/reservoir/result.md practice/pbr/result.md practice/semi95/result.md practice/semi95/vs_dotcom.md practice/semi95/rates.md practice/closing/result.md practice/kospi_streak/after_jump.md
          git commit -m "연습장: KOSPI 연속 하락 결과" || exit 0
          git pull --rebase -q || true
          git push
