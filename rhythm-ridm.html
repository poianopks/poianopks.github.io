.wrap{max-width:960px;margin:0 auto;padding:1rem 1rem 3rem}
.mode-bar{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:0 0 1rem}
.mode-btn{border:1px solid var(--line);border-radius:.9rem;padding:.85rem .7rem;cursor:pointer;font:inherit;font-weight:700;text-align:center}

.mode-btn.rhythm{background:linear-gradient(135deg,#1f4a45,#16352f);color:#b8fff4;border-color:#2f7a70}

.lead{color:var(--m);margin:0 0 .8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem}
.stage-btn{text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#1e293b,#152033);color:var(--t);border-radius:.85rem;padding:.8rem .85rem;cursor:pointer;font:inherit}
.stage-btn:hover{border-color:var(--acc)}
.stage-btn .n{display:inline-flex;width:1.55rem;height:1.55rem;align-items:center;justify-content:center;border-radius:999px;background:#0ea5e9;color:#04101a;font-weight:800;font-size:.82rem;margin-right:.3rem}
.stage-btn small{display:block;color:var(--m);margin-top:.22rem;font-size:.76rem}
#home,#trainer{display:none}
#home.active,#trainer.active{display:block}
.bar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.65rem}
.btn{border:1px solid var(--line);background:#243044;color:#e2e8f0;border-radius:.65rem;padding:.45rem .75rem;cursor:pointer;font:inherit;font-size:.88rem}
.btn.primary{background:linear-gradient(135deg,#0ea5e9,#0369a1);border-color:#38bdf8;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin:.65rem 0}
#sheetContainer{background:#f8fafc;border-radius:.75rem;min-height:200px;overflow-x:auto;color:#0f172a}
.tip{color:var(--m);font-size:.86rem}
.progress{height:.35rem;background:#0f172a;border-radius:99px;overflow:hidden;margin:.45rem 0}
.progress>i{display:block;height:100%;background:var(--ok);width:0%}
.note-row{min-height:1.35rem;font-size:.9rem;color:var(--warn)}

var pianoSynth=null, clickSynth=null, masterVol=null;
function ensureAudio(){
  if(!window.Tone) return;
  if(!masterVol) masterVol=new Tone.Volume(-6).toDestination();
  if(!pianoSynth){
    pianoSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"triangle"},envelope:{attack:0.01,decay:0.35,sustain:0.25,release:0.9}}).connect(masterVol);
    pianoSynth.volume.value=-4;
  }
  if(!clickSynth){
    clickSynth=new Tone.MembraneSynth({octaves:2,envelope:{attack:0.001,decay:0.12,sustain:0}}).connect(masterVol);
    clickSynth.volume.value=-8;
  }
}
function setVol(v){ ensureAudio(); if(masterVol) masterVol.volume.value=-30+(Number(v)/100)*32; }
function setMode(mode){
  stopAudio(); appMode=mode; stages=mode==="rhythm"?rhythmStages:melodyStages;
  currentStageIdx=0; currentExIdx=0;
  document.getElementById("btnRhythm").classList.toggle("on", mode==="rhythm");
  document.getElementById("btnMelody").classList.toggle("on", mode==="melody");
  document.getElementById("modeTag").textContent="모드: "+(mode==="rhythm"?"리듬앱":"멜로디앱");
  document.getElementById("mainTitle").textContent=mode==="rhythm"?"리듬앱 · 리듬 공부":"멜로디앱 · 시창 훈련";
  document.getElementById("mainLead").textContent=mode==="rhythm"
    ?"온음표(1분)부터 32분음표·쉼표를 악보로 보고 피아노/클릭 소리로 확인합니다."
    :"멜로디 음높이를 악보로 보고 피아노 소리로 시창 감각을 키웁니다.";
  showHome();
}
function getEx(){ return stages[currentStageIdx].exercises[currentExIdx]; }
function getItems(ex){
  if(appMode==="rhythm") return ex.items;
  return (ex.notes||[]).map(function(n){ return {duration:n.duration, rest:!!n.rest, dots:n.dots||0, pitch:n.pitch, accidental:n.accidental||null, tonePitch:n.tonePitch}; });
}
function showHome(){
  stopAudio();
  document.getElementById("home").classList.add("active");
  document.getElementById("trainer").classList.remove("active");
  var el=document.getElementById("home");
  el.innerHTML='<h2 style="margin:0 0 .55rem;font-size:1.08rem">'+(appMode==="rhythm"?"리듬앱 단계":"멜로디앱 단계")+'</h2><div class="grid" id="stageGrid"></div>';
  var g=document.getElementById("stageGrid");
  stages.forEach(function(st,i){
    var b=document.createElement("button"); b.className="stage-btn"; b.type="button";
    b.innerHTML='<span class="n">'+(i+1)+'</span><b>'+st.title.replace(/^\d+단계 · /,"")+'</b><small>'+st.desc+' · BPM '+st.bpm+' · '+st.exercises.length+'문제</small>';
    b.onclick=function(){showTrainer(i);}; g.appendChild(b);
  });
}
function showTrainer(si){ currentStageIdx=si; currentExIdx=0; activeIdx=null;
  document.getElementById("home").classList.remove("active"); document.getElementById("trainer").classList.add("active"); refreshAll(); }
function goPrevEx(){ if(currentExIdx>0){ currentExIdx--; refreshAll(); } }
function goNextEx(){ var m=stages[currentStageIdx].exercises.length-1; if(currentExIdx<m){ currentExIdx++; refreshAll(); } }
function stopAudio(){ isPlaying=false; playId++; activeIdx=null; updatePlayBtn(); updateActive(); renderSheet(); }
function beatsOf(it){ var d=String(it.duration).replace(/d$/,""); var base=DUR_BEAT[d]; if(base==null) base=1; if(it.dots) base*=1.5; return base; }
function toneName(it){
  if(it.tonePitch) return it.tonePitch;
  if(it.pitch){ var p=it.pitch.replace("/",""); if(it.accidental==="#") p=p[0]+"#"+p.slice(1); if(it.accidental==="b") p=p[0]+"b"+p.slice(1); return p; }
  return "C4";
}
async function togglePlay(){
  if(isPlaying){ stopAudio(); return; }
  if(!window.Tone){ alert("오디오 로드 실패"); return; }
  await Tone.start(); ensureAudio(); setVol(document.getElementById("vol").value);
  isPlaying=true; updatePlayBtn();
  var my=++playId, st=stages[currentStageIdx], items=getItems(getEx()), beatSec=60/st.bpm, stype=document.getElementById("soundType").value;
  for(var i=0;i<items.length;i++){
    if(my!==playId) break;
    var it=items[i]; activeIdx=i; updateActive(); renderSheet();
    var dur=Math.max(0.05, beatsOf(it)*beatSec*0.9);
    if(!it.rest){
      try{
        if(stype==="click") clickSynth.triggerAttackRelease("C2", Math.min(0.08,dur));
        else {
          if(pianoSynth.set){
            if(stype==="epiano") try{ pianoSynth.set({oscillator:{type:"sine"}, envelope:{attack:0.005,decay:0.4,sustain:0.3,release:1.1}}); }catch(e){}
            else try{ pianoSynth.set({oscillator:{type:"triangle"}, envelope:{attack:0.01,decay:0.35,sustain:0.25,release:0.9}}); }catch(e){}
          }
          if(appMode==="rhythm") pianoSynth.triggerAttackRelease(["C4","E4","G4"], dur*0.85);
          else pianoSynth.triggerAttackRelease(toneName(it), dur);
        }
      }catch(e){ console.warn(e); }
    }
    await new Promise(function(r){ setTimeout(r, beatsOf(it)*beatSec*1000); });
  }
  if(my===playId) stopAudio();
}
function updatePlayBtn(){ document.getElementById("playBtn").textContent=isPlaying?"정지":"들어보기 (피아노)"; }
function updateActive(){
  var row=document.getElementById("activeNoteRow"), items=getItems(getEx());
  if(activeIdx==null||!items[activeIdx]){ row.textContent=""; return; }
  var it=items[activeIdx], lab=DUR_KR[it.duration+(it.rest?"r":"")]||DUR_KR[it.duration]||it.duration;
  if(it.dots) lab="점 "+lab;
  if(appMode==="melody"&&!it.rest) lab+=" · "+(it.tonePitch||it.pitch);
  row.textContent=(it.rest?"⏸ ":"♪ ")+lab;
}
function vexDur(it){
  var d=String(it.duration);
  if(it.rest){ var map={w:"wr",h:"hr",q:"qr","8":"8r","16":"16r","32":"32r"}; return map[d]||(d.indexOf("r")>=0?d:d+"r"); }
  if(it.dots&&d.slice(-1)!=="d") d+="d"; return d;
}
function renderSheet(){
  var c=document.getElementById("sheetContainer"); if(!c) return;
  if(!window.Vex||!window.Vex.Flow){
    c.innerHTML='<p style="padding:1rem;color:#64748b">악보 로딩 중…</p>';
    if(renderRetries<30){ renderRetries++; window._vexReadyCb=function(){renderRetries=0;renderSheet();}; setTimeout(function(){if(!vexLoaded)renderSheet();},500); }
    else c.innerHTML='<p style="padding:1rem;color:#dc2626">VexFlow 로드 실패</p>'; return;
  }
  renderRetries=0; window._vexReadyCb=null; c.innerHTML="";
  try{
    var VF=Vex.Flow, ex=getEx(), items=getItems(ex), w=Math.min(c.offsetWidth||640,900);
    var renderer=new VF.Renderer(c, VF.Renderer.Backends.SVG); renderer.resize(w,220);
    var ctx=renderer.getContext(), stave=new VF.Stave(10,40,w-20);
    stave.addClef("treble"); stave.addTimeSignature(ex.timeSignature.num+"/"+ex.timeSignature.den); stave.setContext(ctx).draw();
    var sns=items.map(function(it,idx){
      var dur=vexDur(it), keys=it.rest?["b/4"]:[it.pitch||"G/4"];
      var sn=new VF.StaveNote({keys:keys,duration:dur,clef:"treble"});
      if(it.accidental&&!it.rest){ try{ sn.addAccidental(0,new VF.Accidental(it.accidental)); }catch(e){} }
      if(it.dots){ try{ if(VF.Dot&&VF.Dot.buildAndAttach) VF.Dot.buildAndAttach([sn],{all:true}); else sn.addDotToAll(); }catch(e){ try{sn.addDotToAll();}catch(e2){} } }
      var active=idx===activeIdx; try{ sn.setStyle({fillStyle:active?"#7c3aed":"#1e293b",strokeStyle:active?"#7c3aed":"#1e293b"}); }catch(e){}
      return sn;
    });
    var voice=new VF.Voice({num_beats:ex.timeSignature.num,beat_value:ex.timeSignature.den});
    if(voice.setStrict) voice.setStrict(false); voice.addTickables(sns);
    new VF.Formatter().joinVoices([voice]).format([voice], Math.max(80,w-120)); voice.draw(ctx,stave);
    try{ VF.Beam.generateBeams(sns.filter(function(n,i){return !items[i].rest;})).forEach(function(b){b.setContext(ctx).draw();}); }catch(e){}
  }catch(e){ c.innerHTML='<p style="padding:1rem;color:#dc2626">악보 오류: '+e.message+'</p>'; }
}
function refreshAll(){
  stopAudio();
  var st=stages[currentStageIdx];
  document.getElementById("banner").textContent=(appMode==="rhythm"?"리듬앱":"멜로디앱")+" · "+st.title+" · 문제 "+(currentExIdx+1)+"/"+st.exercises.length+" · BPM "+st.bpm;
  document.getElementById("exLabel").textContent=st.desc;
  document.getElementById("tip").textContent=appMode==="rhythm"
    ?"리듬앱: 박을 세며 피아노 코드 소리에 맞춰 보세요. 쉼표도 길이만큼 쉬기."
    :"멜로디앱: 음높이를 듣고 따라 불러 보세요. #/b 있으면 반음 주의.";
  document.getElementById("legend").innerHTML=(appMode==="rhythm"?["온(1분)","2분","4분","8분","16분","32분","점","쉼표","피아노"]:["음높이","리듬","임시표","피아노 소리"]).map(function(t){return '<span class="chip">'+t+'</span>';}).join("");
  document.getElementById("progBar").style.width=((currentExIdx/(st.exercises.length-1||1))*100)+"%";
  document.getElementById("prevExBtn").disabled=currentExIdx===0;
  setTimeout(renderSheet,40);
}
window.addEventListener("resize",function(){ if(document.getElementById("trainer").classList.contains("active")) renderSheet(); });
setMode("rhythm");
</script>
